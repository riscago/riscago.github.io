  });
  rxn.atoms.forEach(a=>{
    layout[a.id].lps.forEach((ang,i)=>{
      if(lpHidden(a.id,i))return;
      const[cx,cy]=lpXY(a.id,ang),perp=(ang+90)*Math.PI/180,g=ns('g');
      g.dataset.lp=a.id+':'+i;
      [-3.5,3.5].forEach(s=>{
        const d=ns('circle');
        d.setAttribute('cx',cx+s*Math.cos(perp));d.setAttribute('cy',cy+s*Math.sin(perp));
        d.setAttribute('r',3);d.setAttribute('class','lp-dot');
        g.appendChild(d);
      });
      molG.appendChild(g);
    });
    layout[a.id].ups.forEach((ang,i)=>{
      if(unpHidden(a.id,i))return;
      const[cx,cy]=lpXY(a.id,ang),d=ns('circle');
      d.dataset.unp=a.id+':'+i;
      d.setAttribute('cx',cx);d.setAttribute('cy',cy);d.setAttribute('r',3.6);d.setAttribute('class','lp-dot rad');
      molG.appendChild(d);
    });
  });
  if(!busy&&!finished&&!drag&&showHints()){
    const src=hintSource();
    if(src){
      const h=ns('circle');
      h.setAttribute('cx',src[0]);h.setAttribute('cy',src[1]);h.setAttribute('r',11);
      h.setAttribute('class','halo');
      molG.appendChild(h);
    }
  }
}
// 다음에 그려야 할 화살표의 출발점
function hintSource(){
  const k=done.indexOf(false),ar=curStep().arrows[k];
  if(!ar)return null;
  if(ar.from.lp||ar.from.unp){
    const id=ar.from.lp||ar.from.unp,isU=!!ar.from.unp;
    const want=ar.to?dirAngle(id,ar.to):ar.toBond?dirAngle(id,ar.toBond[0]===id?ar.toBond[1]:ar.toBond[0]):0;
    let best=null,bd=1e9;
    (isU?layout[id].ups:layout[id].lps).forEach((ang,i)=>{
      if(isU?unpHidden(id,i):lpHidden(id,i))return;
      const d=angDist(ang,want);
      if(d<bd){bd=d;best=lpXY(id,ang);}
    });
    return best;
  }
  const b=findBond(ar.from.bond[0],ar.from.bond[1]);
  if(!b)return null;
  return ar.viaMsg?bondPoint(b,ar.via,0.28):segMid(b);
}

/* ---------- 곡선 화살표 ---------- */
function curve(x1,y1,x2,y2){
  const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;
  const bend=Math.max(16,Math.min(50,L*0.35)),cx=mx-dy/L*bend,cy=my+dx/L*bend;
  return{d:`M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`,cx,cy};
}
// 화살촉: 전자쌍은 양쪽 날개, 전자 1개(반쪽 화살표·낚싯바늘)는 곡선 바깥쪽 날개 하나
function head(x2,y2,cx,cy,half,x1,y1){
  const a=Math.atan2(y2-cy,x2-cx),s=half?10:9;
  const p1=[x2-s*Math.cos(a-0.42),y2-s*Math.sin(a-0.42)],p2=[x2-s*Math.cos(a+0.42),y2-s*Math.sin(a+0.42)];
  if(!half)return`M ${x2} ${y2} L ${p1[0]} ${p1[1]} L ${p2[0]} ${p2[1]} Z`;
  const side=(px,py)=>Math.sign((x2-x1)*(py-y1)-(y2-y1)*(px-x1));
  const out=side(cx,cy),barb=side(p1[0],p1[1])===out?p1:p2;
  const ax=x2-s*0.78*Math.cos(a),ay=y2-s*0.78*Math.sin(a);
  return`M ${x2} ${y2} L ${barb[0]} ${barb[1]} L ${ax} ${ay} Z`;
}
// 화살촉이 원소 기호를 덮지 않도록 살짝 앞에서 멈춤
function arrowEnd(sx,sy,id){
  const[tx,ty]=pos[id],dx=tx-sx,dy=ty-sy,L=Math.hypot(dx,dy)||1;
  const t=Math.min((isVertex(atomsById[id])?8:trimAt(id,dx/L,dy/L)+1),L*0.4);
  return[tx-dx/L*t,ty-dy/L*t];
}
function drawDoneArrow(src,drop,n,spec){
  let ex,ey;
  if(spec&&spec.toBond){const b=findBond(spec.toBond[0],spec.toBond[1]);[ex,ey]=b?segMid(b):pairMid(spec.toBond[0],spec.toBond[1]);}
  else if(drop.atom)[ex,ey]=arrowEnd(src.x,src.y,drop.atom);
  else{const b=findBond(drop.bond[0],drop.bond[1]);[ex,ey]=b?segMid(b):pairMid(drop.bond[0],drop.bond[1]);}
  const half=src.kind==='half';
  const{d,cx,cy}=curve(src.x,src.y,ex,ey),g=ns('g');
  const path=ns('path');path.setAttribute('class','done-arrow'+(half?' half':''));path.setAttribute('d',d);
  const hd=ns('path');hd.setAttribute('class','arrowhead');hd.setAttribute('d',head(ex,ey,cx,cy,half,src.x,src.y));
  const bx=0.25*src.x+0.5*cx+0.25*ex,by=0.25*src.y+0.5*cy+0.25*ey;
  const ox=bx-(src.x+ex)/2,oy=by-(src.y+ey)/2,oL=Math.hypot(ox,oy)||1;
  const badge=ns('g');badge.setAttribute('class','seq');
  const c=ns('circle');c.setAttribute('cx',bx+ox/oL*10);c.setAttribute('cy',by+oy/oL*10);c.setAttribute('r',7.5);
  const t=ns('text');t.setAttribute('x',bx+ox/oL*10);t.setAttribute('y',by+oy/oL*10);t.textContent=n;
  badge.append(c,t);
  g.append(path,hd,badge);
  doneG.appendChild(g);
}

/* ================= 엔진 2: 판정 · 반응 진행 · 드래그 ================= */
/* 판정 규칙
   - 화살표는 정해진 순서대로 (step.order: 'loose'면 ①만 먼저, 'free'면 순서 자유)
   - 비공유 전자쌍 X → 원자 Y : Y 또는 X–Y 결합 위에 놓아도 정답
   - 결합 P–Q → 제3의 원자 Z : Z 또는 via–Z 결합 위에 놓아도 정답
   - 반쪽 화살표(전자 1개, half): 홀전자 또는 결합에서 출발
       to: 원자 → 그 원자에 전자 1개 / toBond: [U,V] → 새로 생기는 U–V 결합(두 원자 사이 빈 곳이나 상대 원자에 놓기)
   - 화살표 종류(→ 전자쌍 / ⇀ 전자 1개)가 다르면 'type' 피드백
   - viaMsg가 있으면 결합의 어느 쪽 끝에서 출발했는지(위치선택성)까지 검사
   - alts: 화학적으로 동등한 다른 정답, traps: 흔한 오개념에 대한 맞춤 피드백 */
const arKind=ar=>ar.half?'half':'full';
function srcMatch(f,src){
  if(f.lp)return src.type==='lp'&&src.atom===f.lp;
  if(f.unp)return src.type==='unp'&&src.atom===f.unp;
  return src.type==='bond'&&sameBond(src.a,src.b,f.bond[0],f.bond[1]);
}
function dropMatch(ar,d,siblings){
  if(ar.toBond){
    const[U,V]=ar.toBond;
    if(d.bond)return sameBond(d.bond[0],d.bond[1],U,V);
    if(d.atom!==U&&d.atom!==V)return false;
    if(ar.from.unp||ar.from.lp)return d.atom!==(ar.from.unp||ar.from.lp);
    // 결합에서 출발: 출발 결합의 원자에 놓았다면, 같은 결합에서 그 원자로 가는 다른 화살표가 없을 때만 인정
    if(!ar.from.bond.includes(d.atom))return true;
    return !(siblings||[]).some(o=>o!==ar&&o.to===d.atom&&o.from.bond&&sameBond(o.from.bond[0],o.from.bond[1],ar.from.bond[0],ar.from.bond[1]));
  }
  if(d.atom)return d.atom===ar.to;
  const[u,v]=d.bond;
  if(ar.from.lp||ar.from.unp)return sameBond(u,v,ar.from.lp||ar.from.unp,ar.to);
  const[P,Q]=ar.from.bond;
  if(ar.to===P||ar.to===Q)return false;
  return !!ar.via&&sameBond(u,v,ar.via,ar.to);
}
// 위치가 맞는 변형(본 정답 또는 alts)
const matchPos=(ar,src,d,sib)=>[ar].concat(ar.alts||[]).find(v=>srcMatch(v.from,src)&&dropMatch(v,d,sib))||null;
function allowed(k){
  if(done[k])return false;
  const o=curStep().order;
  if(o==='free')return true;
  if(k===done.indexOf(false))return true;
  return o==='loose'&&done[0]&&k>0;
}
function classify(src,d){
  const arrows=curStep().arrows;
  let typeHit=null;
  for(let k=0;k<arrows.length;k++){
    if(done[k])continue;
    const m=matchPos(arrows[k],src,d,arrows);
    if(!m)continue;
    if(arKind(m)!==src.kind){typeHit=typeHit||{kind:'type',half:!!m.half};continue;}
    if(!allowed(k))return{kind:'early',arrow:m};
    if(m.viaMsg&&src.type==='bond'&&src.near&&src.near!==m.via)return{kind:'regio',msg:tx(m.viaMsg)};
    return{kind:'ok',k,spec:m};
  }
  if(typeHit)return typeHit;
  for(let k=0;k<arrows.length;k++)if(done[k]&&matchPos(arrows[k],src,d,arrows))return{kind:'dup'};
  for(let s=stepIndex+1;s<rxn.steps.length;s++)
    if(rxn.steps[s].arrows.some(a=>matchPos(a,src,d,rxn.steps[s].arrows)))return{kind:'future',step:s};
  const tr=(curStep().traps||[]).find(x=>srcMatch(x.from,src)&&dropMatch(x,d));
  if(tr)return{kind:'trap',trap:tr};
  return{kind:'bad'};
}
function earlyMsg(ar){
  if(ar.early)return tx(ar.early);
  if(ar.from.bond&&ar.from.bond.includes(ar.to))return t('early_break');
  return t('early_gen');
}
function shake(){board.classList.remove('shake');void board.offsetWidth;board.classList.add('shake');}

function judge(src,d){
  const res=classify(src,d),n=curStep().arrows.length;
  if(res.kind==='ok'){
    done[res.k]=true;chosen[res.k]=res.spec;drawnCount++;hintOn=false;
    if(src.type==='lp')(pendingLp[src.atom]=pendingLp[src.atom]||[]).push(src.idx);
    if(src.type==='unp')(pendingUnp[src.atom]=pendingUnp[src.atom]||[]).push(src.idx);
    haptic('ok');
    drawDoneArrow(src,d,drawnCount,res.spec);
    if(drawnCount===n){
      busy=true;
      showToast(t('ok_go'),'ok');
      const g=gen;setTimeout(()=>{if(g===gen)applyStep();},500);
    }else{
      showToast(t('ok_n',{d:drawnCount,n})+(mode==='learn'?t('ok_next'):''),'ok');
    }
    updateGuide();render();return;
  }
  render();
  if(res.kind==='dup'){haptic('bad');showToast(t('dup'),'bad');return;}
  if(res.kind==='trap'&&res.trap.soft){haptic('order');showToast(tx(res.trap.msg),'order',4200);return;}
  mistakes++;updatePos();
  if(res.kind==='early'){
    haptic('order');showToast(earlyMsg(res.arrow),'order',4200);
  }else if(res.kind==='future'){
    haptic('order');
    const s2=rxn.steps[res.step];
    showToast(t('future',{s:res.step+1})+(s2.notYet?' '+tx(s2.notYet):''),'order',4500);
  }else if(res.kind==='type'){
    haptic('order');showToast(t(res.half?'type_half':'type_full'),'order',4500);
    const seg=$('arrowSeg');if(seg){seg.classList.remove('attn');void seg.offsetWidth;seg.classList.add('attn');}
  }else if(res.kind==='regio'){
    haptic('order');showToast(res.msg,'order',5000);
  }else if(res.kind==='trap'){
    haptic('bad');shake();showToast(tx(res.trap.msg),'bad',5000);
  }else{
    haptic('bad');shake();showToast(t('bad'),'bad');
  }
}

/* ---------- 단계 효과: 화살표에서 결합·전하·전자 자동 계산 ---------- */
function applyArrow(ar){
  const add=(id,dq)=>{charge[id]=(charge[id]||0)+dq;};
  const bondUp=(a,b)=>{const x=findBond(a,b);if(x)x.order++;else bonds.push({a,b,order:1});};
  if(ar.from.lp){
    const X=ar.from.lp,Y=ar.to;
    lpCount[X]--;add(X,+1);add(Y,-1);bondUp(X,Y);
    return;
  }
  const[P,Q]=ar.from.bond,Z=ar.to,b=findBond(P,Q);
  b.order--;if(b.order<=0)bonds.splice(bonds.indexOf(b),1);
  if(Z===P||Z===Q){lpCount[Z]++;add(Z,-1);add(Z===P?Q:P,+1);return;}
  const near=u=>Math.hypot(pos[u][0]-pos[Z][0],pos[u][1]-pos[Z][1]);
  const via=ar.via||(near(P)<near(Q)?P:Q);
  bondUp(via,Z);add(via===P?Q:P,+1);add(Z,-1);
}
// 반쪽 화살표 단계: 전자를 1개씩 세어 한꺼번에 반영
//   결합 전자 2개 증감 = 결합 차수 ±1, 원자에 남는 비결합 전자 N → 전자쌍 ⌊N/2⌋ + 홀전자 N mod 2
//   형식전하 변화 = −(비결합 전자 변화) − (결합 차수 합 변화)
function applyHalfStep(arrows){
  const ids=rxn.atoms.map(a=>a.id);
  const own=id=>2*(lpCount[id]||0)+(unpCount[id]||0);
  const bo=id=>bonds.reduce((s,b)=>s+(b.a===id||b.b===id?b.order:0),0);
  const before={};ids.forEach(id=>before[id]=[own(id),bo(id)]);
  const e={},nb={};
  arrows.forEach(ar=>{
    const f=ar.from;
    if(f.unp)unpCount[f.unp]--;
    else if(f.lp){lpCount[f.lp]--;unpCount[f.lp]=(unpCount[f.lp]||0)+1;}
    else{const k=bkey(f.bond[0],f.bond[1]);e[k]=(e[k]||0)-1;}
    if(ar.toBond){const k=bkey(ar.toBond[0],ar.toBond[1]);e[k]=(e[k]||0)+1;}
    else nb[ar.to]=(nb[ar.to]||0)+1;
  });
  Object.entries(e).forEach(([k,de])=>{
    const[a,b]=k.split('|'),x=findBond(a,b),dOrd=Math.trunc(de/2);
    if(!dOrd)return;
    if(x){x.order+=dOrd;if(x.order<=0)bonds.splice(bonds.indexOf(x),1);}
    else if(dOrd>0)bonds.push({a,b,order:dOrd});
  });
  Object.entries(nb).forEach(([z,n])=>{
    const N=own(z)+n;lpCount[z]=Math.floor(N/2);unpCount[z]=N%2;
  });
  ids.forEach(id=>{
    const[o0,b0]=before[id];
    charge[id]=(charge[id]||0)-(own(id)-o0)-(bo(id)-b0);
  });
}
function applyStep(){
  const g=gen,st=curStep(),mv=st.move||{},specs=chosen.slice();
  const start={};Object.keys(mv).forEach(id=>start[id]=[...pos[id]]);
  const t0=performance.now(),dur=900;let swapped=false;
  function frame(now){
    if(g!==gen)return;
    const tt=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-tt,3);
    Object.keys(mv).forEach(id=>{const[x0,y0]=start[id],[x1,y1]=mv[id];pos[id]=[x0+(x1-x0)*e,y0+(y1-y0)*e];});
    if(tt>0.4&&!swapped){
      swapped=true;
      if(isHalfStep(st))applyHalfStep(specs);else specs.forEach(applyArrow);
      pendingLp={};pendingUnp={};doneG.innerHTML='';
      haptic('finish');
    }
    render();
    if(tt<1){requestAnimationFrame(frame);return;}
    busy=false;
    if(stepIndex<rxn.steps.length-1){
      stepIndex++;resetStepState();
      showToast(tx(st.caption)||t('next_step'),'ok');
      updateGuide();renderStrip();
    }else{
      finished=true;complete(tx(st.caption));
    }
    render();
  }
  requestAnimationFrame(frame);
}
function complete(caption){
  const r=rec[rxn.id]||(rec[rxn.id]={});
  let line;
  if(mode==='practice'){
    const score=mistakes+hintsUsed;
    if(!r.p||score<r.p.m+r.p.h)r.p={m:mistakes,h:hintsUsed};
    line=score===0?t('perfect'):t('score',{m:mistakes,h:hintsUsed});
  }else{
    r.learn=true;line=t('learned');
  }
  saveRec();hintBtn.disabled=true;
  instructionEl.innerHTML=`<span class="formula">${esc(tx(rxn.eq))}</span><b>${esc(line)}</b> ${esc(caption||'')}`;
  renderStrip();onComplete();
  showToast(mode==='practice'?line:(caption||line),'ok',3200);
  nextBtn.focus({preventScroll:true});
}

/* ---------- 드래그 ---------- */
function svgPoint(ev){const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;return pt.matrixTransform(svg.getScreenCTM().inverse());}
function projT(p,s){
  const dx=s.ex-s.sx,dy=s.ey-s.sy,L2=dx*dx+dy*dy||1;
  return Math.max(0,Math.min(1,((p.x-s.sx)*dx+(p.y-s.sy)*dy)/L2));
}
function distToSeg(p,s){const tt=projT(p,s);return Math.hypot(p.x-(s.sx+tt*(s.ex-s.sx)),p.y-(s.sy+tt*(s.ey-s.sy)));}
// 손가락 위치에서 가장 가까운 전자쌍·홀전자 또는 결합
function pickSource(p){
  let best=null,bd=1e9;
  rxn.atoms.forEach(a=>{
    layout[a.id].lps.forEach((ang,i)=>{
      if(lpHidden(a.id,i))return;
      const[x,y]=lpXY(a.id,ang),d=Math.hypot(p.x-x,p.y-y);
      if(d<22&&d<bd){bd=d;best={type:'lp',kind:'full',atom:a.id,idx:i,x,y};}
    });
    layout[a.id].ups.forEach((ang,i)=>{
      if(unpHidden(a.id,i))return;
      const[x,y]=lpXY(a.id,ang),d=Math.hypot(p.x-x,p.y-y)-2;   // 홀전자는 점 하나라 살짝 우선
      if(d<22&&d<bd){bd=d;best={type:'unp',kind:'half',atom:a.id,idx:i,x,y};}
    });
  });
  bonds.forEach(b=>{
    const s=bondSeg(b),d=distToSeg(p,s);
    if(d<16&&d<bd){
      bd=d;
      const tt=Math.max(0.2,Math.min(0.8,projT(p,s)));
      best={type:'bond',kind:arrowMode==='single'?'half':'full',a:b.a,b:b.b,near:tt<0.5?b.a:b.b,x:s.sx+tt*(s.ex-s.sx),y:s.sy+tt*(s.ey-s.sy)};
    }
  });
  return best;
}
// 아직 없는 결합(반쪽 화살표가 만드는 새 결합)도 두 원자 사이 빈 곳에 놓을 수 있게
function virtualPairs(){
  const out=[];
  curStep().arrows.forEach(ar=>[ar].concat(ar.alts||[]).forEach(v=>{
    if(v.toBond&&!findBond(v.toBond[0],v.toBond[1])&&!out.some(p=>sameBond(p[0],p[1],v.toBond[0],v.toBond[1])))out.push(v.toBond);
  }));
  return out;
}
// 도착점: 원자 우선, 그다음 결합(출발한 결합 제외), 그다음 새로 생길 결합 자리
function pickDrop(p,src){
  let atom=null,ad=28;
  rxn.atoms.forEach(a=>{const[x,y]=pos[a.id],d=Math.hypot(p.x-x,p.y-y);if(d<ad){ad=d;atom=a.id;}});
  if(atom)return{atom};
  let bond=null,bd=13;
  bonds.forEach(b=>{
    if(src.type==='bond'&&sameBond(b.a,b.b,src.a,src.b))return;
    const d=distToSeg(p,bondSeg(b));
    if(d<bd){bd=d;bond=[b.a,b.b];}
  });
  if(bond)return{bond};
  let vb=null,vd=20;
  virtualPairs().forEach(([u,v])=>{const d=distToSeg(p,pairSeg(u,v));if(d<vd){vd=d;vb=[u,v];}});
  return vb?{bond:vb,virtual:true}:null;
}
function moveGhost(x,y){
  const g=$('ghostLp');if(!g)return;
  if(g.children.length===1){g.children[0].setAttribute('cx',x);g.children[0].setAttribute('cy',y);return;}
  g.children[0].setAttribute('cx',x-4);g.children[0].setAttribute('cy',y);
  g.children[1].setAttribute('cx',x+4);g.children[1].setAttribute('cy',y);
}
function showVirtualGlow(pair){
  let l=$('vGlow');
  if(!pair){if(l)l.remove();return;}
  const s=pairSeg(pair[0],pair[1]);
  if(!l){l=ns('line');l.id='vGlow';l.setAttribute('class','vbond-glow');dragG.insertBefore(l,dragG.firstChild);}
  l.setAttribute('x1',s.sx);l.setAttribute('y1',s.sy);l.setAttribute('x2',s.ex);l.setAttribute('y2',s.ey);
}
svg.addEventListener('pointerdown',ev=>{
  if(busy||finished||drag)return;
  computeLayout();
  const src=pickSource(svgPoint(ev));
  if(!src)return;
  ev.preventDefault();
  drag={src,hover:null,hoverBond:null,pid:ev.pointerId};
  try{svg.setPointerCapture(ev.pointerId);}catch(e){}
  haptic('grab');
  const path=ns('path');path.setAttribute('class','drag-arrow'+(src.kind==='half'?' half':''));path.id='liveArrow';
  const hd=ns('path');hd.setAttribute('class','arrowhead');hd.id='liveHead';
  dragG.append(path,hd);
  if(src.type==='lp'||src.type==='unp'){
    const g=ns('g');g.id='ghostLp';
    for(let k=0;k<(src.type==='lp'?2:1);k++){const d=ns('circle');d.setAttribute('r',3.5);d.setAttribute('class','ghost-dot');g.appendChild(d);}
    dragG.appendChild(g);moveGhost(src.x,src.y);
  }
  render();
});
svg.addEventListener('pointermove',ev=>{
  if(!drag||ev.pointerId!==drag.pid)return;
  const p=svgPoint(ev),{d,cx,cy}=curve(drag.src.x,drag.src.y,p.x,p.y);
  $('liveArrow').setAttribute('d',d);$('liveHead').setAttribute('d',head(p.x,p.y,cx,cy,drag.src.kind==='half',drag.src.x,drag.src.y));
  moveGhost(p.x,p.y);
  const tg=pickDrop(p,drag.src),hov=tg&&tg.atom||null,hb=tg&&tg.bond?bkey(tg.bond[0],tg.bond[1]):null;
  if(hov!==drag.hover||hb!==drag.hoverBond){
    molG.querySelectorAll('.drop-glow.on,.bond-glow.on').forEach(g=>g.classList.remove('on'));
    if(hov){const g=molG.querySelector(`[data-atom="${hov}"] .drop-glow`);if(g)g.classList.add('on');}
    if(hb){const g=molG.querySelector(`[data-bond="${hb}"] .bond-glow`);if(g)g.classList.add('on');}
    showVirtualGlow(tg&&tg.virtual?tg.bond:null);
    if(hov||hb)haptic('hover');
    drag.hover=hov;drag.hoverBond=hb;
  }
});
svg.addEventListener('pointerup',ev=>{
  if(!drag||ev.pointerId!==drag.pid)return;
  const p=svgPoint(ev),dd=drag;
  drag=null;dragG.innerHTML='';
  const tg=pickDrop(p,dd.src);
  if(!tg){render();return;}
  judge(dd.src,tg);
});
svg.addEventListener('pointercancel',ev=>{if(drag&&ev.pointerId===drag.pid){drag=null;dragG.innerHTML='';render();}});
svg.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= 엔진 3: 화면 전환 · 목록 · 검색 · 반응 카드 · 언어 ================= */
// 광고 모듈이 없으면(단일 파일 버전) 광고도 잠금도 없음
const ADS=window.Ads||{view(){},lang(){},isLocked(){return false;},unlock(){return Promise.resolve({ok:true,why:'already'});},cancel(){}};
const CFG=window.APP_CONFIG||{};
const ORDER=[];                       // 직접 그릴 수 있는 반응 (단원 순서)
BOOK.forEach(c=>c.rows.forEach(r=>{if(RX[r.id])ORDER.push(r.id);}));
const chapOf=id=>BOOK.find(c=>c.rows.some(r=>r.id===id));
let curId=null;

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// 검색용 정규화: 아래·위 첨자 숫자와 기호를 일반 문자로
const SUBMAP={'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','⁺':'+','⁻':'-','−':'-','–':'-'};
const normText=s=>String(s||'').toLowerCase().replace(/[₀-₉⁺⁻−–]/g,c=>SUBMAP[c]).replace(/\s+/g,'');
const both=v=>v&&typeof v==='object'?[v.ko,v.en].join(' '):(v||'');   // 검색은 두 언어 모두에서
const LOCK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>';
const unitLocked=id=>ADS.isLocked(chapOf(id).n);
function marks(id){const r=rec[id]||{};return(r.learn?'✓':'')+(r.p?(r.p.m+r.p.h===0?'★':'●'):'');}

function showView(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id===v));}
function go(h){if(location.hash.replace(/^#/,'')===h)route();else location.hash=h;}

function rowHTML(r,showCh){
  const play=!!RX[r.id],lk=play&&unitLocked(r.id),cond=tx(r.cond),type=tx(r.type);
  return `<div class="row${play?' play':''}${lk?' locked':''}" data-id="${esc(r.id)}" role="button" tabindex="0">
    <div class="r1"><span class="ic" aria-hidden="true">${lk?LOCK_SVG:play?'▶':''}</span><span class="nm">${esc(tx(r.name))}</span><span class="mk">${marks(r.id)}</span></div>
    <div class="eq">${esc(tx(r.eq))}</div>
    <div class="meta">${showCh?`<span class="tag ch">${esc(t('unit',{n:chapOf(r.id).n}))}</span>`:''}${type?`<span class="tag">${esc(type)}</span>`:''}<span class="st">${'★'.repeat(r.stars||0)}</span></div>
    ${play?'':`<div class="more">${cond?`<div><b>${esc(t('cond'))}</b> ${esc(cond)}</div>`:''}<div class="soon">${esc(t('soon'))}</div></div>`}
  </div>`;
}
function renderHome(){
  const q=normText($('q').value),el=$('homeList');
  if(q){
    const hits=[];
    BOOK.forEach(c=>c.rows.forEach(r=>{if(normText([both(r.name),both(r.eq),both(r.cond),both(r.type)].join(' ')).includes(q))hits.push(r);}));
    el.innerHTML=hits.length?`<div class="hits">${esc(t('hits',{n:hits.length,p:hits.filter(r=>RX[r.id]).length}))}</div>`+hits.map(r=>rowHTML(r,true)).join('')
      :`<div class="empty">${esc(t('no_hits',{q:$('q').value}))}</div>`;
    return;
  }
  el.innerHTML=BOOK.map(c=>{
    const p=c.rows.filter(r=>RX[r.id]),fin=p.filter(r=>marks(r.id)).length,lk=ADS.isLocked(c.n);
    const sub=t('unit_sub',{p:p.length,n:c.rows.length})+(lk?' · '+t('lock_sub'):'');
    const right=lk?`<span class="lock">${LOCK_SVG}${esc(t('special'))}</span>`:p.length?`<span class="pr" aria-label="${fin}/${p.length}"><i style="width:${Math.round(fin/p.length*100)}%"></i></span>`:'';
    return `<button class="chap${lk?' locked':''}" data-ch="${c.n}"><span class="no">${c.n}</span><span class="tt">${esc(tx(c.title))}<small>${esc(sub)}</small></span>${right}</button>`;
  }).join('');
}
function renderChapter(n){
  const c=BOOK.find(x=>x.n===n);
  if(!c){go('');return;}
  $('chTitle').textContent=tx(c.title);
  const p=c.rows.filter(r=>RX[r.id]).length;
  $('chSub').textContent=`${t('unit',{n:c.n})} · ${t('ch_sub',{p,n:c.rows.length})}`;
  let html=c.rows.map(r=>rowHTML(r,false)).join('');
  if(c.results&&c.results.length)html+=`<details class="res"><summary>${esc(t('results',{n:c.results.length}))}</summary><ul>${c.results.map(x=>`<li>${esc(tx(x))}</li>`).join('')}</ul></details>`;
  $('chList').innerHTML=html;
  $('chList').parentElement.scrollTop=0;
}

/* ---------- 플레이 ---------- */
function showToast(msg,cls,ms){
  toast.textContent=msg;toast.className='show '+(cls||'');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.className='',ms||2400);
}
function setArrowMode(m){
  arrowMode=m;
  document.querySelectorAll('[data-arrow]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.arrow===m));
}
function resetStepState(){
  done=curStep().arrows.map(()=>false);chosen=[];drawnCount=0;hintOn=false;
  if(mode==='learn')setArrowMode(isHalfStep(curStep())?'single':'pair');   // 학습 모드: 화살표 종류 자동 전환
}
function updateGuide(){
  const st=curStep(),total=rxn.steps.length,n=st.arrows.length;
  const tag=total>1?`<span class="stepno">${esc(t('step_tag',{i:stepIndex+1,n:total}))}</span>`:'';
  const body=mode==='learn'?tx(st.guide):esc(tx(st.goal)||tx(st.title)||t('goal_default'));
  instructionEl.innerHTML=`<span class="formula">${esc(tx(rxn.eq))}</span>${tag}${body}<span class="count">${esc(t('arrows_count',{d:drawnCount,n}))}</span>`;
}
function updatePos(){
  $('pos').innerHTML=`<b>${ORDER.indexOf(curId)+1}</b>/${ORDER.length}`+(mode==='practice'?esc(t('pos_practice',{m:mistakes,h:hintsUsed})):'');
}
function renderStrip(){
  const el=$('strip');
  if(!rxn||rxn.steps.length<2){el.innerHTML='';el.hidden=true;return;}
  el.hidden=false;
  el.innerHTML=rxn.steps.map((s,i)=>{
    const cls=finished||i<stepIndex?'done':i===stepIndex?'cur':'';
    return `<span class="pill ${cls}">${i+1} ${esc(tx(s.title))}${s.extra?` <i>${esc(t('extra_step'))}</i>`:''}</span>`;
  }).join('<span class="sep">›</span>');
  const cur=el.querySelector('.cur');
  if(cur)el.scrollLeft=cur.offsetLeft-el.clientWidth/2+cur.clientWidth/2;
}
function onComplete(){$('cardBtn').classList.add('attn');}
// 세로로 긴 휴대폰 화면에 가로로 긴 반응이 작게 보이지 않도록, 필요하면 전체를 90° 돌려서 배치
function orient(R){
  const b=$('board'),W=b.clientWidth||390,Hh=b.clientHeight||600,xs=[],ys=[];
  R.atoms.forEach(a=>{xs.push(a.x);ys.push(a.y);});
  R.steps.forEach(s=>Object.values(s.move||{}).forEach(([x,y])=>{xs.push(x);ys.push(y);}));
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  if(!(Hh>W*1.15&&(x1-x0)>(y1-y0)*1.3))return R;
  const cx=(x0+x1)/2,cy=(y0+y1)/2,r=([x,y])=>[cx-(y-cy),cy+(x-cx)];
  return{...R,atoms:R.atoms.map(a=>{const[x,y]=r([a.x,a.y]);return{...a,x,y};}),
    steps:R.steps.map(s=>({...s,move:Object.keys(s.move||{}).reduce((o,k)=>(o[k]=r(s.move[k]),o),{})}))};
}
function playTitles(){
  const c=chapOf(curId);
  $('rxTitle').textContent=tx(rxn.name);
  $('rxSub').textContent=`${t('unit',{n:c.n})} · ${tx(c.title)}`;
  nextBtn.textContent=ORDER.indexOf(curId)<ORDER.length-1?t('btn_next'):t('btn_first');
}
function loadRx(id){
  if(!RX[id]){go('');return;}
  const R=orient(RX[id]);
  gen++;curId=id;rxn=R;stepIndex=0;
  atomsById={};pos={};lpCount={};unpCount={};charge={};
  R.atoms.forEach(a=>{atomsById[a.id]=a;pos[a.id]=[a.x,a.y];lpCount[a.id]=a.lp||0;unpCount[a.id]=a.unp||0;charge[a.id]=a.charge||0;});
  bonds=R.bonds.map(([a,b,o])=>({a,b,order:o||1}));
  $('arrowSeg').hidden=!hasHalf(R);setArrowMode('pair');
  resetStepState();pendingLp={};pendingUnp={};busy=false;finished=false;drag=null;mistakes=0;hintsUsed=0;
  doneG.innerHTML='';dragG.innerHTML='';clearTimeout(toastTimer);toast.className='';toast.textContent='';
  playTitles();
  nextBtn.disabled=false;hintBtn.disabled=false;hintBtn.hidden=mode!=='practice';
  $('cardBtn').classList.remove('attn');
  try{localStorage.setItem(STORE+'.last',id);}catch(e){}
  fitView();updateGuide();updatePos();renderStrip();render();
}

/* ---------- 반응 카드 ---------- */
function openCard(){
  if(!rxn)return;
  const R=rxn,c=R.card||{},showSteps=mode==='learn'||finished;
  const sec=(k,v)=>{const s=tx(v);return s&&s!=='—'?`<h4>${esc(t(k))}</h4><p>${esc(s)}</p>`:'';};
  const cond=tx(R.cond);
  $('sheetBody').innerHTML=`<h3>${esc(tx(R.name))}</h3><p class="eq">${esc(tx(R.eq))}</p>${cond?`<p class="cond">${esc(cond)}</p>`:''}
    ${sec('c_exam',c.exam)}${sec('c_rds',c.rds)}${sec('c_sel',c.sel)}
    ${c.mistakes&&c.mistakes.length?`<h4>${esc(t('c_mistakes'))}</h4><ul>${c.mistakes.map(m=>`<li><b>${esc(tx(m.a))}</b> — ${esc(tx(m.why))}</li>`).join('')}</ul>`:''}
    <h4>${esc(t('c_steps'))}</h4>${showSteps?`<ol>${R.steps.map(s=>`<li>${esc(tx(s.title))}${s.caption?` → <span class="cap">${esc(tx(s.caption))}</span>`:''}</li>`).join('')}</ol>`:`<p>${esc(t('c_locked'))}</p>`}
    ${c.note?`<p class="note">${esc(tx(c.note))}</p>`:''}`;
  $('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');
  $('sheet').querySelector('.panel').scrollTop=0;
}
function closeCard(){
  $('sheet').classList.remove('open');$('sheet').setAttribute('aria-hidden','true');
  if(unlocking)ADS.cancel();   // 광고를 기다리는 중에 창을 닫으면 광고를 띄우지 않음
}

/* ---------- 특별 단원: 광고 보고 열기 ---------- */
let gToastTimer,unlocking=false;
function gToast(msg){const g=$('gtoast');g.textContent=msg;g.className='show';clearTimeout(gToastTimer);gToastTimer=setTimeout(()=>{g.className='';},2800);}
// 다음 반응이 잠긴 단원이면 그다음 열린 단원의 첫 반응
function nextOpenAfter(id){
  const k=ORDER.indexOf(id);
  for(let i=1;i<=ORDER.length;i++){const x=ORDER[(k+i)%ORDER.length];if(!unitLocked(x))return x;}
  return null;
}
function openUnlock(n,then,skip){
  const c=BOOK.find(x=>x.n===n);if(!c)return;
  const h=ADS.unlockHours;
  $('sheetBody').innerHTML=`<div class="unlock"><div class="lockbig">${LOCK_SVG}</div><h3>${esc(t('unlock_title'))}</h3>
    <p>${esc(t('unlock_body',{u:tx(c.title)}))} ${esc(h?t('unlock_hours',{h}):t('unlock_forever'))}</p>
    <p class="msg" id="unlockMsg" role="status"></p>
    <button id="unlockGo" class="primary wide">${esc(t('unlock_watch'))}</button>
    ${skip?`<button id="unlockSkip" class="wide">${esc(t('unlock_skip'))}</button>`:''}</div>`;
  $('sheet').classList.add('open');$('sheet').setAttribute('aria-hidden','false');
  const btn=$('unlockGo');
  btn.addEventListener('click',()=>{
    if(unlocking)return;
    unlocking=true;btn.disabled=true;btn.textContent=t('unlock_loading');$('unlockMsg').textContent='';
    ADS.unlock(n).then(res=>{
      unlocking=false;
      if(res.ok){closeCard();go(then);gToast(t(res.why==='free'?'unlock_free':'unlock_done'));return;}
      if(res.why==='cancelled')return;
      btn.disabled=false;btn.textContent=t('unlock_watch');$('unlockMsg').textContent=t('unlock_early');
    });
  });
  if(skip)$('unlockSkip').addEventListener('click',()=>{closeCard();go(skip);});
}
// 잠긴 단원으로 가려 하면 열기 창을 띄움 (그 밖엔 바로 이동)
function goGated(h,skip){
  const m=h.match(/^(rx|ch)\/(.+)$/);
  const n=m?(m[1]==='rx'?(RX[m[2]]?chapOf(m[2]).n:null):+m[2]):null;
  if(n!=null&&ADS.isLocked(n))openUnlock(n,h,skip);else go(h);
}

/* ---------- 모드 · 언어 · 라우팅 · 이벤트 ---------- */
function setMode(m,reload){
  mode=m;
  try{localStorage.setItem(STORE+'.mode',m);}catch(e){}
  document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  hintBtn.hidden=m!=='practice';
  if(reload&&curId&&$('play').classList.contains('on')){
    loadRx(curId);
    showToast(t(m==='practice'?'t_practice':'t_learn'),m==='practice'?'order':'',3000);
  }
}
function applyLangChrome(){
  applyStaticText();
  document.title=t('doc_title');
  const pl=$('privacyLink'),u=CFG.privacyUrl&&(CFG.privacyUrl[LANG]||CFG.privacyUrl.ko);
  if(pl){pl.hidden=!u;if(u)pl.href=u;}
}
function setLang(l){
  LANG=l;
  try{localStorage.setItem('electronPush.lang',l);}catch(e){}
  applyLangChrome();ADS.lang(l);
  if($('play').classList.contains('on')&&rxn){
    playTitles();renderStrip();updatePos();
    if(!finished)updateGuide();
  }else route();
}
function route(){
  const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));
  closeCard();
  let m,v;
  // 잠긴 특별 단원으로 바로 들어온 경우(링크·뒤로 가기): 홈에서 열기 창
  const lockedN=(m=h.match(/^rx\/(.+)$/))&&RX[m[1]]?(unitLocked(m[1])?chapOf(m[1]).n:null):(m=h.match(/^ch\/(\d+)$/))&&ADS.isLocked(+m[1])?+m[1]:null;
  if(lockedN!=null){
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    showView('home');renderHome();ADS.view('home');openUnlock(lockedN,h);return;
  }
  if((m=h.match(/^rx\/(.+)$/))&&RX[m[1]]){v='play';showView(v);loadRx(m[1]);}
  else if((m=h.match(/^ch\/(\d+)$/))&&BOOK.some(c=>c.n===+m[1])){v='chapter';showView(v);renderChapter(+m[1]);}
  else{v='home';showView(v);renderHome();}
  ADS.view(v);
}
window.addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const tg=e.target;
  const mb=tg.closest('[data-mode]');if(mb){setMode(mb.dataset.mode,true);return;}
  const ab=tg.closest('[data-arrow]');if(ab){setArrowMode(ab.dataset.arrow);haptic('hover');return;}
  if(tg.closest('#langBtn')){setLang(LANG==='ko'?'en':'ko');return;}
  if(tg.closest('#privacyOptionsBtn')){if(ADS.privacyOptions)ADS.privacyOptions();return;}
  if(tg.closest('[data-back]')){
    if($('play').classList.contains('on')&&curId)go('ch/'+chapOf(curId).n);else go('');
    return;
  }
  const ch=tg.closest('.chap');if(ch){goGated('ch/'+ch.dataset.ch);return;}
  const row=tg.closest('.row');
  if(row){if(RX[row.dataset.id])goGated('rx/'+row.dataset.id);else row.classList.toggle('open');}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeCard();
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('row')){e.preventDefault();e.target.click();}
});
$('q').addEventListener('input',renderHome);
$('cardBtn').addEventListener('click',openCard);
$('sheetClose').addEventListener('click',closeCard);
$('sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeCard();});
hintBtn.addEventListener('click',()=>{if(busy||finished||hintOn)return;hintOn=true;hintsUsed++;updatePos();render();});
nextBtn.addEventListener('click',()=>{
  const k=ORDER.indexOf(curId),nx=ORDER[(k+1)%ORDER.length];
  if(!unitLocked(nx)){go('rx/'+nx);return;}
  const alt=nextOpenAfter(nx);   // 다음이 잠긴 특별 단원이면: 광고 보고 열기 또는 건너뛰기
  openUnlock(chapOf(nx).n,'rx/'+nx,alt&&alt!==curId?'rx/'+alt:null);
});
ADS.onChange=()=>{if($('home').classList.contains('on'))renderHome();};
resetBtn.addEventListener('click',()=>{if(curId)loadRx(curId);});

applyLangChrome();
setMode(mode,false);
route();

if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform()))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
