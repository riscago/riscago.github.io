<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f6f8fb">
<meta name="description" content="곡선 화살표를 손가락으로 직접 그리며 유기화학 반응 메커니즘을 익히는 학습 앱. 단원별 반응, 학습·연습 모드, 라디칼 반쪽 화살표 지원.">
<title>Electron Push — 유기화학 전자 이동 연습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{--paper:#f6f8fb;--grid:#dbe4ef;--ink:#1b2a4a;--ink-soft:#5d6b85;--arrow:#c8283c;--ok:#0e8a6d;--warn:#a06a00;
    --glow:rgba(200,40,60,.18);--card:#ffffff;--line:#e3e9f2}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);user-select:none;-webkit-user-select:none}
  button{font:inherit;font-size:13px;font-weight:600;padding:9px 13px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
  button:disabled{opacity:.3;cursor:default}
  button.primary{background:var(--ink);color:#fff}
  button:focus-visible,.row:focus-visible,.chap:focus-visible{outline:2px solid var(--arrow);outline-offset:2px}
  [hidden]{display:none!important}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.on{display:flex}
  .bar{padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--grid);background:var(--paper)}
  .brand{flex:1;font-size:17px;font-weight:800;letter-spacing:-.03em}
  .brand em{font-style:normal;color:var(--arrow)}
  .back{border:0;font-size:24px;line-height:1;padding:2px 8px 4px 2px}
  .ttl{flex:1;min-width:0}
  .t1{font-size:14px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .t2{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;flex-shrink:0}
  .seg button{border:0;border-radius:0;padding:6px 11px;font-size:12px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  #langBtn{padding:6px 10px;font-size:12px;border-color:var(--grid);flex-shrink:0}
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:28px}
  /* 홈 */
  .searchbox{padding:12px 14px 4px}
  .searchbox input{width:100%;font:inherit;font-size:14px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--grid);background:var(--card);color:var(--ink);user-select:text;-webkit-user-select:text}
  .searchbox input:focus{outline:none;border-color:var(--ink)}
  .intro{font-size:12px;color:var(--ink-soft);padding:8px 16px 6px}
  .chap{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px;font-weight:600;background:transparent}
  .chap .no{width:30px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .chap .tt{flex:1;min-width:0;font-size:14px;letter-spacing:-.02em}
  .chap .tt small{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:500;margin-top:2px}
  .chap .pr{width:44px;height:5px;border-radius:3px;background:var(--grid);overflow:hidden;flex-shrink:0}
  .chap .pr i{display:block;height:100%;background:var(--ok)}
  .foot{font-size:11px;color:var(--ink-soft);line-height:1.6;padding:18px 16px 0}
  .foot p+p{margin-top:6px}
  .foot a{color:var(--ink-soft)}
  .foot button{font-size:11px;padding:4px 10px;border-color:var(--grid);color:var(--ink-soft);margin-top:8px}
  .hits,.empty{font-size:12.5px;color:var(--ink-soft);padding:10px 16px}
  /* 단원 목록 */
  .row{padding:11px 16px 11px;border-bottom:1px solid var(--line);cursor:pointer}
  .row .r1{display:flex;align-items:center;gap:8px}
  .row .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff;background:transparent;border:1.5px dashed var(--grid)}
  .row.play .ic{background:var(--arrow);border:0;padding-left:2px}
  .row .nm{flex:1;font-size:14px;font-weight:600;letter-spacing:-.02em}
  .row:not(.play) .nm{color:var(--ink-soft);font-weight:500}
  .row .mk{font-size:12px;color:var(--ok);font-weight:700}
  .row .eq{font-size:12.5px;margin:4px 0 3px 30px;color:var(--ink);overflow-wrap:anywhere}
  .row:not(.play) .eq{color:var(--ink-soft)}
  .row .meta{margin-left:30px;font-size:11px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
  .tag{border:1px solid var(--grid);border-radius:6px;padding:1px 6px;background:var(--card)}
  .tag.ch{border-color:var(--ink);color:var(--ink)}
  .st{color:var(--warn);letter-spacing:-1px}
  .more{display:none;margin:8px 0 0 30px;font-size:12px;line-height:1.55;color:var(--ink)}
  .row.open .more{display:block}
  .soon{color:var(--warn);margin-top:3px;font-weight:600}
  details.res{margin:14px 16px 0;font-size:13px}
  details.res summary{cursor:pointer;color:var(--ink-soft);font-weight:600;padding:6px 0}
  details.res ul{padding:4px 0 0 20px;color:var(--ink-soft);line-height:1.7;font-size:12.5px}
  /* 플레이 */
  #instruction{padding:8px 16px;font-size:13.5px;line-height:1.55;min-height:58px}
  #instruction b{color:var(--arrow)}
  #instruction small{color:var(--ink-soft);font-size:11.5px}
  #instruction .formula{display:block;font-size:11.5px;color:var(--ink-soft);margin-bottom:2px;overflow-wrap:anywhere}
  #instruction .stepno{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px;margin-right:6px;vertical-align:1px}
  #instruction .count{color:var(--ink-soft);font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
  #strip{display:flex;align-items:center;gap:4px;overflow-x:auto;padding:0 12px 8px;border-bottom:1px solid var(--grid);scrollbar-width:none}
  #strip::-webkit-scrollbar{display:none}
  .pill{flex-shrink:0;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--grid);color:var(--ink-soft);background:var(--card)}
  .pill.cur{border-color:var(--arrow);color:var(--arrow);font-weight:700}
  .pill.done{background:#e6f4ef;border-color:#bfe3d6;color:var(--ok)}
  .pill i{font-style:normal;font-size:10px;color:var(--warn)}
  .sep{color:var(--grid);font-size:13px;flex-shrink:0}
  #board{flex:1;min-height:0;position:relative;touch-action:none;
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
  #svg{width:100%;height:100%;display:block}
  .bond{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
  .bond-glow{stroke:var(--glow);stroke-width:16;stroke-linecap:round;opacity:0}
  .bond-glow.on{opacity:1}
  .vbond-glow{stroke:var(--glow);stroke-width:16;stroke-linecap:round}
  .atom-label{font-size:22px;font-weight:700;fill:var(--ink);text-anchor:middle;dominant-baseline:central;font-family:Georgia,'Times New Roman',serif}
  .atom-label.small{font-size:17px}
  .charge{font-size:15px;font-weight:700;fill:var(--arrow);text-anchor:middle;dominant-baseline:central;font-family:Georgia,serif}
  .lp-dot{fill:var(--ink)}
  .ghost-dot{fill:var(--arrow);opacity:.45}
  .halo{fill:none;stroke:var(--arrow);stroke-width:2;pointer-events:none;transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{stroke-opacity:.9;transform:scale(1)}70%{stroke-opacity:0;transform:scale(1.9)}100%{stroke-opacity:0;transform:scale(1.9)}}
  .drag-arrow{fill:none;stroke:var(--arrow);stroke-width:3.5;stroke-linecap:round}
  .done-arrow{fill:none;stroke:var(--arrow);stroke-width:3;stroke-linecap:round;opacity:.85}
  .drag-arrow.half,.done-arrow.half{stroke-width:2.6}
  .arrowhead{fill:var(--arrow)}
  .seq circle{fill:var(--paper);stroke:var(--arrow);stroke-width:1.5}
  .seq text{font-size:10px;font-weight:700;fill:var(--arrow);text-anchor:middle;dominant-baseline:central;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
  .drop-glow{fill:var(--glow);opacity:0}
  .drop-glow.on{opacity:1}
  /* 화살표 종류 (라디칼 반응에서만 보임) */
  .aseg{position:absolute;top:10px;left:10px;z-index:2;display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
  .aseg button{border:0;border-radius:0;padding:6px 11px;font-size:12px}
  .aseg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .aseg.attn{animation:warnpulse .9s ease-in-out 2}
  @keyframes warnpulse{0%,100%{box-shadow:0 0 0 0 rgba(160,106,0,0)}50%{box-shadow:0 0 0 5px rgba(160,106,0,.35)}}
  #play footer{padding:10px 12px 16px;padding-bottom:max(16px,calc(env(safe-area-inset-bottom) + 8px));display:flex;gap:6px;align-items:center;border-top:1px solid var(--grid)}
  #pos{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #pos b{color:var(--ink)}
  #cardBtn.attn{background:var(--ok);border-color:var(--ok);color:#fff;animation:nudge 1.2s ease-in-out 2}
  @keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:92%;text-align:center;line-height:1.45}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.ok{background:var(--ok)} #toast.bad{background:var(--arrow)} #toast.order{background:var(--warn)}
  .shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  /* 광고 자리: 홈·단원 목록 아래쪽에만 (앱: AdMob 배너 높이만큼 비워 둠, 웹: AdSense) */
  #adBar{flex-shrink:0;height:calc(var(--ad-h,0px) + env(safe-area-inset-bottom,0px));background:var(--paper);border-top:1px solid var(--grid);overflow:hidden}
  #adBar.web{height:auto;min-height:60px;padding-bottom:env(safe-area-inset-bottom,0px)}
  /* 특별 단원 (광고 보고 열기) */
  .chap .lock{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--warn);border:1px solid #ecd9b3;background:#fdf6e8;border-radius:999px;padding:3px 9px 3px 7px;flex-shrink:0}
  .chap .lock svg{width:12px;height:12px}
  .chap.locked .no{background:var(--warn)}
  .row .ic svg{width:11px;height:11px}
  .row.play.locked .ic{background:var(--warn);padding-left:0}
  .unlock{text-align:center;padding:4px 2px 0}
  .unlock .lockbig{width:52px;height:52px;border-radius:16px;background:#fdf6e8;color:var(--warn);display:flex;align-items:center;justify-content:center;margin:6px auto 12px}
  .unlock .lockbig svg{width:26px;height:26px}
  #sheet .unlock p{color:var(--ink-soft)}
  #sheet .unlock .msg{min-height:1.5em;color:var(--warn);font-weight:600;font-size:13px;margin-top:6px}
  button.wide{width:100%;margin-top:10px;padding:12px 14px;font-size:14px}
  #gtoast{position:fixed;left:50%;bottom:calc(20px + var(--ad-h,0px) + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(8px);background:var(--ok);color:#fff;font-size:13px;font-weight:600;
    padding:9px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;width:max-content;max-width:92%;text-align:center;line-height:1.45;z-index:20}
  #gtoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* 반응 카드 */
  #sheet{position:fixed;inset:0;background:rgba(27,42,74,.35);display:none;z-index:10}
  #sheet.open{display:block}
  #sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;background:var(--card);border-radius:18px 18px 0 0;padding:10px 18px 22px;padding-bottom:max(22px,calc(env(safe-area-inset-bottom) + 12px));box-shadow:0 -6px 24px rgba(27,42,74,.15);user-select:text;-webkit-user-select:text}
  #sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--grid);margin:0 auto 10px}
  #sheet h3{font-size:17px;letter-spacing:-.02em;margin-bottom:4px}
  #sheet h4{font-size:12px;color:var(--arrow);margin:14px 0 4px;letter-spacing:.02em}
  #sheet p,#sheet li{font-size:13.5px;line-height:1.6}
  #sheet .eq{font-size:14px;overflow-wrap:anywhere}
  #sheet .cond{color:var(--ink-soft);font-size:12.5px}
  #sheet ul,#sheet ol{padding-left:20px}
  #sheet li+li{margin-top:4px}
  #sheet .cap{color:var(--ok)}
  #sheet .note{font-size:11.5px;color:var(--ink-soft);margin-top:12px}
  #sheetClose{margin-top:16px;width:100%}
  @media (prefers-reduced-motion: reduce){.halo{animation:none;stroke-opacity:.7}.shake,#cardBtn.attn,.aseg.attn{animation:none}#toast,#gtoast{transition:none}}
</style>
</head>
<body>
<section id="home" class="view">
  <header class="bar"><div class="brand">Electron <em>Push</em></div>
    <button id="langBtn" data-t="lang_btn" data-t-aria="lang_label"></button>
    <div class="seg" role="group"><button data-mode="learn" data-t="mode_learn"></button><button data-mode="practice" data-t="mode_practice"></button></div></header>
  <div class="scroll">
    <div class="searchbox"><input id="q" type="search" data-t-ph="search_ph" autocomplete="off"></div>
    <div class="intro" data-t="intro"></div>
    <div id="homeList"></div>
    <div class="foot">
      <p data-t="legend"></p>
      <p data-t="disclaimer"></p>
      <p><a id="privacyLink" href="#" target="_blank" rel="noopener" data-t="privacy" hidden></a></p>
      <button id="privacyOptionsBtn" data-t="ad_privacy" hidden></button>
    </div>
  </div>
</section>
<section id="chapter" class="view">
  <header class="bar"><button class="back" data-back data-t-aria="back">‹</button><div class="ttl"><div class="t1" id="chTitle"></div><div class="t2" id="chSub"></div></div></header>
  <div class="scroll"><div id="chList"></div></div>
</section>
<section id="play" class="view">
  <header class="bar"><button class="back" data-back data-t-aria="back">‹</button><div class="ttl"><div class="t1" id="rxTitle"></div><div class="t2" id="rxSub"></div></div>
    <div class="seg" role="group"><button data-mode="learn" data-t="mode_learn"></button><button data-mode="practice" data-t="mode_practice"></button></div></header>
  <div id="instruction"></div>
  <div id="strip" hidden></div>
  <div id="board">
    <svg id="svg" viewBox="0 0 400 340" preserveAspectRatio="xMidYMid meet"><g id="doneArrows"></g><g id="molecule"></g><g id="dragLayer"></g></svg>
    <div id="arrowSeg" class="aseg" role="group" data-t-aria="arrow_aria" hidden><button data-arrow="pair" data-t="arrow_pair"></button><button data-arrow="single" data-t="arrow_single"></button></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <footer><button id="cardBtn" data-t="btn_card"></button><div id="pos"></div><button id="hintBtn" data-t="btn_hint" hidden></button><button id="resetBtn" data-t="btn_reset"></button><button id="nextBtn" class="primary"></button></footer>
</section>
<div id="adBar" hidden></div>
<div id="gtoast" role="status" aria-live="polite"></div>
<div id="sheet" aria-hidden="true"><div class="panel" role="dialog"><div class="grab"></div><div id="sheetBody"></div><button id="sheetClose" data-t="btn_close"></button></div></div>
<script src="config.js"></script>
<script src="ads.js"></script>
<script>

ve": {"Cl1": [79.1, -35.7]}, "order": null, "title": {"ko": "재배열된 탄소양이온의 염화물 포착", "en": "Chloride captures the rearranged carbocation"}, "caption": {"ko": "재배열 생성물 2-클로로-2-메틸부테인", "en": "Rearranged product, 2-chloro-2-methylbutane"}, "extra": false, "goal": {"ko": "재배열된 탄소양이온의 염화물 포착", "en": "Chloride captures the rearranged carbocation"}, "guide": {"ko": "① <b>Cl</b><small>(HCl)</small>의 비공유 전자쌍 → <b>C</b><small>(이동 H를 가진 인접)</small>", "en": "① the lone pair on <b>Cl</b> → <b>C</b>"}}], "card": {"rds": {"ko": "일반 HX 첨가에서는 양성자화가 느리다. 이 경쟁 재배열 예만으로 하이드라이드 이동의 별도 속도 결정성을 확정하지 않는다.", "en": "In ordinary HX addition protonation is slow. This competing rearrangement example alone doesn't establish the hydride shift as separately rate-determining."}, "sel": {"ko": "2°→3° 양이온 이동이 가능하다. 재배열 여부와 직접 Cl− 포착은 경쟁하며, 이 예를 재배열 단일 생성물로 제시하지 않는다. 선택한 최종 생성물에는 새 입체중심이 없다.", "en": "A 2°→3° cation shift is possible. Rearrangement competes with direct Cl− capture, so this is not presented as a single rearranged product. The chosen final product has no new stereocenter."}, "exam": {"ko": "하이드라이드가 이동한 방향과 양전하가 이동한 방향은 서로 반대이다.", "en": "The hydride moves in the opposite direction to the positive charge."}, "mistakes": [{"a": {"ko": "H 원자에서 화살표 시작", "en": "Starting the arrow at the H atom"}, "why": {"ko": "공여 전자쌍은 H에 자유롭게 있는 것이 아니라 C–H 결합에 있다.", "en": "The donated pair isn't free on H; it's in the C–H bond."}}, {"a": {"ko": "C–H 전자쌍 → C", "en": "C–H electron pair → C"}, "why": {"ko": "1,2 이동의 받개는 인접한 양전하 C이다.", "en": "The acceptor of the 1,2-shift is the adjacent positively charged carbon."}}, {"a": {"ko": "이동 후 양전하를 C와 C 모두에 표시", "en": "Marking positive charge on both carbons after the shift"}, "why": {"ko": "결합을 얻은 C가 중성이 되고 결합을 잃은 C가 양이온이 된다.", "en": "The C that gains a bond becomes neutral; the C that loses a bond becomes the cation."}}]}, "name": {"ko": "하이드라이드 이동을 동반한 HX 첨가", "en": "Hydrohalogenation with a 1,2-hydride shift"}, "eq": {"ko": "CH2=CHCH(CH3)2 + HCl → (CH3)2C(Cl)CH2CH3 (재배 b>Br</b><small>(브로민)</small>", "en": "① the lone pair on <b>Br</b> → <b>C</b> · ② the <b>C–Br</b> bond → <b>Br</b>"}}], "card": {"rds": {"ko": "별도의 속도 결정 단계를 확정하지 않는다. 일반적 설명에서 브로모늄 형성을 느린 사건으로 다루더라도 기질·용매 의존성을 구분해야 한다.", "en": "No separate rate-determining step is fixed. Even if bromonium formation is treated as the slow event, distinguish substrate and solvent dependence."}, "sel": {"ko": "두 Br은 anti로 첨가된다. 대칭 에텐에는 위치 선택성 문제가 없다. 사이클로알켄에서는 trans-1,2-다이할라이드가 생긴다.", "en": "The two Br atoms add anti. Symmetric ethene has no regioselectivity issue. Cycloalkenes give trans-1,2-dihalides."}, "exam": {"ko": "브로모늄에서 두 탄소는 모두 옥텟이며 양전하는 Br에 있다.", "en": "In the bromonium ion both carbons have octets; the positive charge is on Br."}, "mistakes": [{"a": {"ko": "브로모늄 대신 자유 탄소양이온을 최종 정답 중간체로 그림", "en": "Drawing a free carbocation instead of the bromonium ion as the final intermediate"}, "why": {"ko": "고리 알켄에서 관찰되는 anti 선택성을 설명하지 못한다.", "en": "Can't explain the anti selectivity seen with cyclic alkenes."}}, {"a": {"ko": "Br−가 Br과 같은 면에서 C를 공격", "en": "Br− attacks C from the same face as Br"}, "why": {"ko": "다리 브로민이 있는 면의 공격을 그려 실제 뒤쪽 고리 열림을 어긴다.", "en": "Drawing attack on the face with the bridging bromine violates the real backside ring opening."}}, {"a": {"ko": "Br 고리 결합 두 개인데 비공유 전자쌍 3개로 유지", "en": "Keeping three lone pairs on Br even though it has two ring bonds"}, "why": {"ko": "브로모늄 Br은 2결합·2비공유전자쌍, 형식전하 +1이다.", "en": "The bromonium Br has 2 bonds and 2 lone pairs: formal charge +1."}}]}, "name": {"ko": "알켄의 할로젠화", "en": "Halogenation of alkenes"}, "eq": "CH2=CH2 + Br2 → BrCH2CH2Br", "cond": {"ko": "Br2 또는 Cl2; 친핵성 물이 과량 아닌 조건", "en": "Br2 or Cl2; conditions without excess nucleophilic water"}}, "4-2": {"id": "4-2", "atoms": [{"id": "C1", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": -52.0, "y": 10.0}, {"id": "C2", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 0.0, "y": -20.0}, {"id": "Br1", "el": "Br", "h": 0, "lp": 3, "charge": 0, "x": -145.5, "y": 64.0}, {"id": "Br2", "e ov orientation)."}}], "goal": {"ko": "물이 더 치환된 C를 뒤쪽 공격", "en": "Water attacks the more substituted C from the back"}, "guide": {"ko": "① <b>O</b><small>(고리를 여는 물)</small>의 비공유 전자쌍 → <b>C</b><small>(프로펜)</small> · ② <b>C–Br 결합</b> → <b>Br</b><small>(브로모늄 다리)</small>", "en": "① the lone pair on <b>O</b> → <b>C</b> · ② the <b>C–Br</b> bond → <b>Br</b>"}}, {"arrows": [{"from": {"lp": "O2"}, "to": "H1"}, {"from": {"bond": ["O1", "H1"]}, "to": "O1"}], "move": {"C1": [-79.5, 11.1], "C2": [-28.2, 42.1], "Br1": [-80.7, 71.0], "O1": [-17.8, -17.0], "H1": [5.8, -236.4], "C2g1": [31.8, 43.2]}, "order": null, "title": {"ko": "물에 의한 탈양성자화", "en": "Deprotonation by water"}, "caption": {"ko": "1-브로모프로판-2-올 + H3O+ + Br−", "en": "1-Bromopropan-2-ol + H3O+ + Br−"}, "extra": false, "goal": {"ko": "물에 의한 탈양성자화", "en": "Deprotonation by water"}, "guide": {"ko": "① <b>O</b><small>(산소)</small>의 비공유 전자쌍 → <b>H</b><small>(O에서 염기로 옮겨가는)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(고리를 여는 물)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "하나의 속도 결정 단계를 지정하지 않는다.", "en": "No single rate-determining step is assigned."}, "sel": {"ko": "OH는 더 치환된 C에, Br은 덜 치환된 C에 붙는 방향이 우세하다. O와 Br은 anti로 첨가된다. 비키랄 조건의 프로펜에서는 새 입체중심에 대해 라세미 혼합물이 된다.", "en": "OH ends up mainly on the more substituted C and Br on the less substituted C. O and Br add anti. With achiral propene the new stereocenter forms as a racemic mixture."}, "exam": {"ko": "중성 물의 공격은 O+ 중간체를 만들므로 탈양성자화까지 그려야 한다.", "en": "Attack by neutral water forms an O+ intermediate, so the deprotonation must also be drawn."}, "mistakes": [{"a": {"ko": "Br−가 물 대신 공격하여 다이브로마이드를 정답으로 그림", "en": "Drawing Br− attacking instead of water and giving the dibromide as the answer"}, "why": {"ko": "물 과량의 할로하이드린 조건에서는 물의 경쟁 포착 경로를 추적해야 한다.", "en": "Under halohydrin conditions with excess water, track the competing capture by water."}}, {"a": {"ko": "물 O를 공격 후에도 중성·비공유쌍 2개로 유지", "en": "Keeping water's O neutral with two lone pairs even after it attacks"}, "why": {"ko": "새 C–O 결합 후 O는 3결합·1비공유쌍의 +1 옥소늄이다.", "en": "After the new C–O bond, O is a +1 oxonium with three bonds and one lone pair."}}, {"a": {"ko": "H을 떼면서 O–H 전자쌍도 H에 줌", "en": "Removing H and also giving it the O–H electron pair"}, "why": {"ko": "탈양성자화에서는 결합 전자쌍이 O에 남아 중성 알코올이 된다.", "en": "In deprotonation the bonding pair stays on O, giving a neutral alcohol."}}]}, "name": {"ko": "알켄의 할로하이드린 형성", "en": "Halohydrin formation"}, "eq": "CH3CH=CH2 + Br2 + H2O → CH3CH(OH)CH2Br + HBr", "cond": {"ko": "Br2/H2O 또는 NBS, H2O/DMSO", "en": "Br2/H2O or NBS, H2O/DMSO"}}, "4-3": {"id": "4-3", "atoms": [{"id": "C1", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": -52.0, "y": 10.0}, {"id": "C2", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 0.0, "y": -20.0}, {"id": "O1", "el": "O", "h": 2, "lp": 1, "charge": 1, "x": -185.3, "y": 87.0}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": -145.5, "y": 64.0}, {"id": "O2", "el": "O", "h": 1, "lp": 2, "charge": 0, "x": -0.0, "y": -128.0}, {"id": "H2", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": -0.0, "y": -174.0}, {"id": "C2g1", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 52.0, "y": 10.0, "grp": 1}], "bonds": [["C1", "C2", 2], ["H1", "O1", 1], ["H2", "O2", 1], ["C2", "C2g1", 1]], "steps": [{"arrows": [{"from": {"bond": ["C1", "C2"]}, "to": "H1", "via": "C1", "viaMsg": {"ko": "⚠ 마르코프니코프! H는 끝 탄소(CH₂)에 붙어야 더 안정한 2차 탄소 양이온이 생겨요.", "en": "⚠ Markovnikov! H must add to the terminal CH₂ so the more stable secondary carbocation forms."}}, {"from": {"bond": ["O1", "H1"]}, "to": "O1"}], "move": {"O1": [-207.8, 100.0], "H1": [-91.8, 33.0]}, "order": null, "title": {"ko": "말단 탄소 양성자화", "en": "Protonation of the terminal carbon"}, "caption": {"ko": "C의 2° 탄소양이온 + O 물", "en": "2° carbocation at C + water"}, "extra": false, "goal": {"ko": "말단 탄소 양성자화", "en": "Protonation of the terminal carbon"}, "guide": {"ko": "① <b>C=C π 결합</b> → <b>H</b><small>(수소)</small>(새 C–H 결합) · ② <b>O–H 결합</b> → <b>O</b><small>(촉매 H3O+)</small>", "en": "① the <b>C=C</b> π bond → <b>H</b> (new C–H bond) · ② the <b>O–H</b> bond → <b>O</b>"}}, {"arrows": [{"from": {"lp": "O2"}, "to": "C2"}], "move": {"O2": [-0.0, -80.0], "H2": [39.8, -103.0]}, "order": null, "title": {"ko": "물의 친핵성 포착", "en": "Nucleophilic capture by water"}, "caption": {"ko": "양성자화된 프로판-2-올", "en": "Protonated propan-2-ol"}, "extra": false, "goal": {"ko": "물의 친핵성 포착", "en": "Nucleophilic capture by water"}, "guide": {"ko": "① <b>O</b><small>(산소)</small>의 비공유 전자쌍 → <b>C</b><small>(프로펜)</small>", "en": "① the lone pair on <b>O</b> → <b>C</b>"}}, {"arrows": [{"from": {"lp": "O1"}, "to": "H2"}, {"from": {"bond": ["O2", "H2"]}, "to": "O2"}], "move": {"C1": [-91.4, 47.8], "C2": [-39.5, 17.8], "O1": [4.3, -73.8], "H1": [-131.2, 70.8], "O2": [-39.5, -42.2], "C2g1": [12.5, 47.8]}, "order": null, "title": {"ko": "탈양성자화와 산 촉매 재생", "en": "Deprotonation and regeneration of the acid catalyst"}, "caption": {"ko": "중성 프로판-2-올과 재생된 H3O+", "en": "Neutral propan-2-ol and regenerated H3O+"}, "extra": false, "goal": {"ko": "탈양성자화와 산 촉매 재생", "en": "Deprotonation and regeneration of the acid catalyst"}, "guide": {"ko": "① <b>O</b><small>(촉매 H3O+)</small>의 비공유 전자쌍 → <b>H</b><small>(O에서 O로 옮겨 촉…)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(산소)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "일반 산 촉매 수화의 모형에서는 탄소양이온 생성 양성자화가 느린 단계이다. 뒤의 물 포착·탈양성자화가 이어진다.", "en": "In the general acid-catalyzed hydration model, the protonation that forms the carbocation is slow; water capture and deprotonation follow."}, "sel": {"ko": "마르코프니코프 방향. 탄소양이온은 평면이므로 물이 양면에서 접근할 수 있다. 선택한 프로펜 생성물에는 입체중심이 없으며, 1-부텐 같은 예에서는 비키랄 조건에서 라세미 알코올이 생긴다. 재배열 가능한 기질에서는 골격 재배열도 검토한다.", "en": "Markovnikov orientation. The carbocation is planar, so water can approach from either face. The chosen propene product has no stereocenter; with 1-butene, achiral conditions give a racemic alcohol. For substrates that can rearrange, also consider skeletal rearrangement."}, "exam": {"ko": "총전하 +1은 O → C → O → O 순으로 이동하며 촉매가 재생된다.", "en": "The overall +1 charge moves O → C → O → O, and the catalyst is regenerated."}, "mistakes": [{"a": {"ko": "π → H만 그리고 O–H 분해 생략", "en": "Draws only π → H and skips O–H cleavage"}, "why": {"ko": "H에 결합 두 개가 남아 수소의 전자 수를 초과한다.", "en": "H is left with two bonds, exceeding hydrogen's electron count."}}, {"a": {"ko": "물 첨가 뒤 O를 중성으로 두고 반응 종료", "en": "Ending the reaction with O neutral after water adds"}, "why": {"ko": "O는 세 결합을 가져 +1이며 탈양성자화를 해야 한다.", "en": "O has three bonds, so it is +1 and must be deprotonated."}}, {"a": {"ko": "탄소양이온의 한 면만 물이 공격한다고 고정", "en": "Fixing that water attacks only one face of the carbocation"}, "why": {"ko": "비키랄 자유 양이온은 두 면 모두 반응 가능하다.", "en": "A free achiral cation can react on both faces."}}]}, "name": {"ko": "알켄의 산 촉매 수화", "en": "Acid-catalyzed hydration of alkenes"}, "eq": "CH3CH=CH2 + H2O ⇌ CH3CH(OH)CH3", "cond": {"ko": "H3O+ 또는 묽은 H2SO4/H2O", "en": "H3O+ or dilute H2SO4/H2O"}}, "5-1": {"id": "5-1", "atoms": [{"id": "C1", "el": "C", "h": 0, "lp": 0, "charge": 0, "x": -4.7, "y": 0.0}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": -50.7, "y": -0.0}, {"id": "N1", "el": "N", "h": 2, "lp": 2, "charge": -1, "x": -158.7, "y": 0.0}, {"id": "C2", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 55.3, "y": -0.0}], "bonds": [["C1", "C2", 3], ["C1", "H1", 1]], "steps": [{"arrows": [{"from": {"lp": "N1"}, "to": "H1"}, {"from": {"bond": ["C1", "H1"]}, "to": "C1"}], "move": {"C1": [21.3, 0.0], "N1": [-96.7, 0.0], "C2": [81.3, 0.0]}, "order": null, "title": {"ko": "말단 H의 이동", "en": "Transfer of the terminal H"}, "caption": {"ko": "아세틸라이드 음이온과 NH₃; 최종 산·염기 생성물", "en": "Acetylide anion and NH₃; final acid–base products"}, "extra": false, "goal": {"ko": "말단 H의 이동", "en": "Transfer of the terminal H"}, "guide": {"ko": "① <b>N</b><small>(아마이드 이온)</small>의 비공유 전자쌍 → <b>H</b><small>(이동할 말단)</small> · ② <b>C–H 결합</b> → <b>C</b><small>(탈양성자화되는 말단 …)</small>", "en": "① the lone pair on <b>N</b> → <b>H</b> · ② the <b>C–H</b> bond → <b>C</b>"}}], "card": {"rds": {"ko": "단일 양성자 이동으로 모델링한다. 이 반응에 별도의 실험적 속도결정 단계를 지정하지 않는다.", "en": "Modeled as a single proton transfer. No separate experimental rate-determining step is assigned to this reaction."}, "sel": {"ko": "말단 C–H가 필요하다. 내부 알카인에는 해당 H가 없다. 형성되는 sp 음이온의 안정성이 상대적 산성을 설명한다.", "en": "A terminal C–H is needed; internal alkynes don't have that H. The stability of the sp anion explains the relative acidity."}, "exam": {"ko": "말단 알카인 pKa 약 25; NH₃ pKa 약 35이므로 NH₂⁻가 탈양성자화를 진행시킨다.", "en": "Terminal alkyne pKa ≈ 25; NH₃ pKa ≈ 35, so NH₂⁻ drives the deprotonation."}, "mistakes": [{"a": {"ko": "C에서 전자가 없는 H 자체를 향해 화살표를 시작", "en": "Starting the arrow from C toward an H that has no electrons to give"}, "why": {"ko": "양성자 수용체 N의 비공유 전자쌍이 출발점이다.", "en": "The starting point is the lone pair on the proton-accepting N."}}, {"a": {"ko": "C–H 결합 전자쌍 → H", "en": "C–H bonding pair → H"}, "why": {"ko": "그리면 H⁻가 되므로 산·염기 탈양성자화의 생성물과 다르다.", "en": "That would make H⁻, which differs from the product of an acid–base deprotonation."}}, {"a": {"ko": "NH₂⁻ 대신 OH⁻로 완전히 진행하는 화살표", "en": "Arrows that run all the way to OH⁻ instead of NH₂⁻"}, "why": {"ko": "물보다 말단 알카인이 훨씬 약한 산이므로 이 조건의 평형은 음이온 형성에 불리하다.", "en": "A terminal alkyne is a much weaker acid than water, so under these conditions the equilibrium disfavors the anion."}}]}, "name": {"ko": "말단 알카인의 탈양성자화", "en": "Deprotonation of a terminal alkyne"}, "eq": "RC≡CH + NH₂⁻ → RC≡C⁻ + NH₃", "cond": {"ko": "NaNH₂; 보통 액체 NH₃", "en": "NaNH₂; usually liquid NH₃"}}, "5-2": {"id": "5-2", "atoms": [{"id": "C1", "el": "C", "h": 0, "lp": 1, "charge": -1, "x": 30.0, "y": -0.0}, {"id": "C2", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 138.0, "y": -0.0}, {"id": "Br1", "el": "Br", "h": 0, "lp": 3, "charge": 0, "x": 198.0, "y": -0.0}, {"id": "C3", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": -30.0, "y": -0.0}], "bonds": [["C1", "C3", 3], ["Br1", "C2", 1]], "steps": [{"arrows": [{"from": {"lp": "C1"}, "to": "C2"}, {"from": {"bond": ["C2", "Br1"]}, "to": "Br1"}], "move": {"C2": [90.0, -0.0], "Br1": [224.0, -0.0]}, "order": null, "title": {"ko": "뒤쪽 공격과 Br 이탈", "en": "Backside attack and loss of Br"}, "caption": {"ko": "프로파인과 Br⁻; 안정한 중간체 없음", "en": "Propyne and Br⁻; no stable intermediate"}, "extra": false, "goal": {"ko": "뒤쪽 공격과 Br 이탈", "en": "Backside attack and loss of Br"}, "guide": {"ko": "① <b>C</b><small>(친핵성 아세틸라이드)</small>의 비공유 전자쌍 → <b>C</b><small>(메틸 브로마이드)</small> · ② <b>C–Br 결합</b> → <b>Br</b><small>(이탈할)</small>", "en": "① the lone pair on <b>C</b> → <b>C</b> · ② the <b>C–Br</b> bond → <b>Br</b>"}}], "card": {"rds": {"ko": "SN2 한 단계가 속도를 정한다. 기질과 친핵체가 함께 전이상태에 참여한다.", "en": "The single SN2 step sets the rate. Substrate and nucleophile both take part in the transition state."}, "sel": {"ko": "C–Br 반대쪽에서 공격한다. 메틸 예제에는 입체중심이 없다. 반응 중심이 입체중심인 적합한 기질에서 SN2가 일어나면 기하학적 반전이 일어난다. 혼잡한 2차·3차에서는 E2 경쟁이 커진다.", "en": "Attack anti to C–Br. The methyl example has no stereocenter. When SN2 occurs at a stereocenter of a suitable substrate, the configuration inverts. With crowded 2° and 3° substrates, E2 competes more."}, "exam": {"ko": "탄소 수를 늘리는 C–C 결합 형성이고 메틸·1차 할라이드를 선택한다.", "en": "This C–C bond formation lengthens the carbon chain; choose methyl or 1° halides."}, "mistakes": [{"a": {"ko": "C≡C의 π 결합 → C", "en": "C≡C π bond → C"}, "why": {"ko": "알킬화에 쓰는 것은 C의 음전하를 가진 비공유 전자쌍이다.", "en": "Alkylation uses the negatively charged lone pair on C."}}, {"a": {"ko": "C–Br 결합 전자쌍 → C", "en": "C–Br bonding pair → C"}, "why": {"ko": "Br⁻ 이탈을 설명하지 못하고 탄소의 전자수를 잘못 늘린다.", "en": "This can't explain Br⁻ leaving and wrongly increases carbon's electron count."}}, {"a": {"ko": "Br 이탈 후 메틸 양이온을 거쳐 공격", "en": "Attack via a methyl cation after Br leaves"}, "why": {"ko": "메틸 기질의 SN2에는 자유 메틸 양이온 중간체가 없다.", "en": "SN2 at a methyl substrate has no free methyl cation intermediate."}}]}, "name": {"ko": "아세틸라이드의 알킬화"  example: recombination of two halogen radicals"}, "guide": {"ko": "① <b>Br</b><small>(할로젠 원자 2)</small>의 홀전자 → <b>Br–Br</b> 새 결합 · ② <b>Br</b><small>(할로젠 원자 4)</small>의 홀전자 → <b>Br–Br</b> 새 결합 <small>(동시에 일어나서 순서 자유)</small> <small>· 반쪽 화살표(전자 1개)</small>", "en": "① the unpaired electron on <b>Br</b> → the new <b>Br–Br</b> bond · ② the unpaired electron on <b>Br</b> → the new <b>Br–Br</b> bond <small>(concerted — any order)</small> <small>· fishhook arrows (one electron each)</small>"}}], "card": {"rds": {"ko": "라디칼 할로젠화 전체의 특정 속도결정 단계를 단일하게 지정하지 않는다. H 추출의 활성화 장벽이 위치별 반응성과 선택성에 중요하다.", "en": "No single rate-determining step is assigned for radical halogenation as a whole. The activation barrier for H abstraction matters for site reactivity and selectivity."}, "sel": {"ko": "알릴 H를 치환하고 C=C를 유지한다. 비대칭 알릴 라디칼은 양 끝의 결합 형성으로 위치 이성질체가 가능하다.", "en": "Substitutes the allylic H and keeps C=C. An unsymmetrical allylic radical can bond at either end, giving regioisomers."}, "exam": {"ko": "알릴 치환을 이중결합에 대한 Br₂ 첨가와 구별한다.", "en": "Distinguish allylic substitution from Br₂ addition to the double bond."}, "mistakes": [{"a": {"ko": "Br–Br 결합에서 전자쌍 전체를 한 Br로 이동", "en": "Moving the whole Br–Br electron pair to one Br"}, "why": {"ko": "이온성 분해가 아니라 각각 전자 1개를 갖는 균일분해다.", "en": "It's homolysis with one electron each, not ionic cleavage."}}, {"a": {"ko": "H 추출 때 C–H 전자쌍 전체를 탄소로 이동", "en": "Moving the whole C–H pair to carbon during H abstraction"}, "why": {"ko": "라디칼 추출에서는 C와 H에 전자를 하나씩 나눠야 한다.", "en": "In radical abstraction, split the electrons one each to C and H."}}, {"a": {"ko": "라디칼에 음전하를 자동으로 붙임", "en": "Automatically giving the radical a negative charge"}, "why": {"ko": "탄소 라디칼의 V−N−B=4−1−3=0이다.", "en": "For the carbon radical, V − N − B = 4 − 1 − 3 = 0."}}]}, "name": {"ko": "NBS에 의한 알릴 브로민화", "en": "NBS allylic bromination"}, "eq": {"ko": "알릴 C–H + NBS → 알릴 C–Br + succinimide", "en": "allylic C–H + NBS → allylic C–Br + succinimide"}, "cond": {"ko": "NBS, 빛; 용매 CCl₄", "en": "NBS, on the methanol O in the product"}, "why": {"ko": "O은 결합 2개, 비공유 전자 4개라 6−4−2=0이다.", "en": "O has 2 bonds and 4 nonbonding electrons: 6 − 4 − 2 = 0."}}]}, "name": {"ko": "할로알케인의 SN2 치환", "en": "SN2 substitution of alkyl halides"}, "eq": "CH₃Br + OH⁻ → CH₃OH + Br⁻", "cond": {"ko": "좋은 친핵체, 메틸·1차 기질, 흔히 극성 비양성자성 용매", "en": "Good nucleophile, methyl or 1° substrate, often a polar aprotic solvent"}}, "7-2": {"id": "7-2", "atoms": [{"id": "C1", "el": "C", "h": 0, "lp": 0, "charge": 0, "x": 0.0, "y": 0.0}, {"id": "Br1", "el": "Br", "h": 0, "lp": 3, "charge": 0, "x": -30.0, "y": -52.0}, {"id": "O1", "el": "O", "h": 1, "lp": 2, "charge": 0, "x": -104.3, "y": -28.0}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": -148.8, "y": -39.9}, {"id": "O2", "el": "O", "h": 2, "lp": 2, "charge": 0, "x": -253.1, "y": -67.8}, {"id": "C1g1", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 30.0, "y": 52.0, "grp": 1}, {"id": "C1g2", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": -52.0, "y": 30.0, "grp": 1}, {"id": "C1g3", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 52.0, "y": -30.0, "grp": 1}], "bonds": [["Br1", "C1", 1], ["H1", "O1", 1], ["C1", "C1g1", 1], ["C1", "C1g2", 1], ["C1", "C1g3", 1]], "steps": [{"arrows": [{"from": {"bond": ["C1", "Br1"]}, "to": "Br1"}], "move": {"Br1": [-43.0, -74.5]}, "order": null, "title": {"ko": "C–Br 이온화", "en": "C–Br ionization"}, "caption": {"ko": "tert-뷰틸 양이온과 Br⁻", "en": "tert-Butyl cation and Br⁻"}, "extra": false, "goal": {"ko": "C–Br 이온화", "en": "C–Br ionization"}, "guide": {"ko": "① <b>C–Br 결합</b> → <b>Br</b><small>(브로민 이탈기)</small>", "en": "① the <b>C–Br</b> bond → <b>Br</b>"}}, {"arrows": [{"from": {"lp": "O1"}, "to": "C1"}], "move": {"Br1": [-60.3, -99.0], "O1": [-30.0, -52.0], "H1": [-7.0, -91.8]}, "order": null, "title": {"ko": "물의 친핵성 포착", "en": "Nucleophilic capture by water"}, "caption": {"ko": "양성자화된 tert-뷰탄올(옥소늄)", "en": "Protonated tert-butanol (oxonium)"}, "extra": false, "goal": {"ko": "물의 친핵성 포착", "en": "Nucleophilic capture by water"}, "guide": {"ko": "① <b>O</b><small>(공격하는 물)</small>의 비공유 전자쌍 → <b>C</b><small>(tert-뷰틸 중심)</small>", "en": "① the lone pair on <b>O</b> → <b>C</b>"}}, {"arrows": [{"from": {"lp": "O2"}, "to": "H1"}, {"from": {"bond": ["O1", "H1"]}, "to": "O1"}], "move": {"C1": [25.8, 3.0], "O1": [-4.2, -49.0], "H1": [-207.3, -72.3], "C1g1": [55.8, 54.9], "C1g2": [-26.1, 33.0], "C1g3": [77.8, -27.0]}, "order": null, "title": {"ko": "물에 의한 탈양성자화", "en": "Deprotonation by water"}, "caption": {"ko": "tert-뷰탄올, H₃O⁺, Br⁻", "en": "tert-Butanol, H₃O⁺, Br⁻"}, "extra": false, "goal": {"ko": "물에 의한 탈양성자화", "en": "Deprotonation by water"}, "guide": {"ko": "① <b>O</b><small>(산소)</small>의 비공유 전자쌍 → <b>H</b><small>(최종 탈양성자화에서 …)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(공격하는 물)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "1단계 C–Br 이온화. 친핵체는 이 단계에 참여하지 않아 기본 속도식은 k[RX]다.", "en": "Step 1, C–Br ionization. The nucleophile isn't involved, so the basic rate law is k[RX]."}, "sel": {"ko": "이 예제는 키랄하지 않다. 키랄 기질이 평면 탄소 양이온을 거치면 양면 공격으로 라세미화 경향이 생긴다. 이온쌍 때문에 완전 1:1이 아닐 수 있고 약한 반전 과잉도 가능하다. E1이 경쟁할 수 있다.", "en": "This example is achiral. A chiral substrate passing through a planar carbocation tends toward racemization by attack on both faces; ion pairing can make it less than 1:1 with slight excess inversion. E1 can compete."}, "exam": {"ko": "SN1은 양이온 안정성·좋은 이탈기·극성 용매가 중요하고 이온화가 느리다.", "en": "SN1 depends on cation stability, a good leaving group, and a polar solvent; ionization is slow."}, "mistakes": [{"a": {"ko": "물 공격과 C–Br 이탈을 반드시 한 화살표 묶음으로 처리", "en": "Treating water attack and C–Br departure as one bundle of arrows"}, "why": {"ko": "이 기질·조건의 SN1은 먼저 이온화되어 양이온 중간체가 생긴다.", "en": "For this substrate and these conditions, SN1 ionizes first to form a cation intermediate."}}, {"a": {"ko": "O이 C과 결합한 뒤 O의 전하를 0으로 둠", "en": "Setting O's charge to 0 after it bonds to C"}, "why": {"ko": "결합 3개와 전자쌍 1개이면 O의 전하는 +1이다.", "en": "With 3 bonds and 1 lone pair, O carries a +1 charge."}}, {"a": {"ko": "O의 H가 시약 없이 그냥 사라짐", "en": "The H on O simply disappears without a reagent"}, "why": {"ko": "다른 물 O가 H을 받아 H₃O⁺가 되어야 원자·전하가 보존된다.", "en": "Another water O must take the H to become H₃O⁺, conserving atoms and charge."}}]}, "name": {"ko": "할로알케인의 SN1 가용매분해", "en": "SN1 solvolysis of alkyl halides"}, "eq": "(CH₃)₃CBr + 2 H₂O → (CH₃)₃COH + H₃O⁺ + Br⁻", "cond": {"ko": "물·알코올 등 극성 양성자성 용매; 안정한 양이온을 주는 기질", "en": "Polar protic solvent such as water or alcohol; substrate that gives a stable cation"}}, "7-3": {"id": "7-3", "atoms": [{"id": "C1", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": -20.8, "y": 19.4}, {"id": "C2", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": 27.2, "y": -16.7}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 69.5, "y": 1.3}, {"id": "Br1", "el": "Br", "h": 0, "lp": 3, "charge": 0, "x": -76.0, "y": -4.1}, {"id": "O1", "el": "O", "h": 0, "lp": 3, "charge": -1, "x": 168.9, "y": 43.6}, {"id": "O1g1", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 224.1, "y": 67.1, "grp": 1}], "bonds": [["C1", "C2", 1], ["Br1", "C1", 1], ["C2", "H1", 1], ["O1", "O1g1", 1]], "steps": [{"arrows": [{"from": {"lp": "O1"}, "to": "H1"}, {"from": {"bond": ["C2", "H1"]}, "to": "C1", "via": "C2"}, {"from": {"bond": ["C1", "Br1"]}, "to": "Br1"}], "move": {"C1": [-44.7, 9.2], "C2": [3.3, -26.8], "H1": [126.6, 25.6], "Br1": [-99.9, -14.3]}, "order": "loose", "title": {"ko": "β-H 추출과 π 결합 형성 및 Br 이탈", "en": "β-H removal, π bond formation, and loss of Br"}, "caption": {"ko": "에텐, 메탄올, Br⁻; 안정한 중간체 없음", "en": "Ethene, methanol, Br⁻; no stable intermediate"}, "extra": false, "traps": [{"from": {"lp": "O1"}, "to": "C1", "msg": {"ko": "그건 SN2(치환)예요. 이 문제는 β-H를 떼어 내는 E2 — 강한 염기·가열 조건이에요.", "en": "That's SN2 (substitution). This problem is E2: a strong base removes the β-H."}}], "goal": {"ko": "β-H 추출과 π 결합 형성 및 Br 이탈", "en": "β-H removal, π bond formation, and loss of Br"}, "guide": {"ko": "① <b>O</b><small>(메톡사이드)</small>의 비공유 전자쌍 → <b>H</b><small>(제거할 β)</small> · ② <b>C–H 결합</b> → <b>C–C 사이</b>(π 결합) · ③ <b>C–Br 결합</b> → <b>Br</b><small>(이탈)</small> <small>(① 다음 나머지는 순서 자유)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>C–H</b> bond → between <b>C–C</b> (π bond) · ③ the <b>C–Br</b> bond → <b>Br</b> <small>(after ①, any order)</small>"}}], "card": {"rds": {"ko": "하나의 concerted 단계. C–H 절단이 이 단계에 포함되어 큰 1차 동위원소 효과가 가능하다.", "en": "A single concerted step. C–H cleavage is part of this step, so a large primary isotope effect is possible."}, "sel": {"ko": "H–C–C–Br이 anti periplanar인 배좌를 선택한다. 이 예제는 에텐만 가능해 E/Z가 없다. 다른 기질에서는 Zaitsev 경향·염기 부피·anti 배열을 함께 판단하고 고리에서는 trans-diaxial 조건을 우선한다.", "en": "Choose the conformation where H–C–C–Br is anti-periplanar. This example can only give ethene, so there is no E/Z. For other substrates weigh the Zaitsev tendency, base size, and anti alignment; in rings the trans-diaxial requirement comes first."}, "exam": {"ko": "E2의 세 화살표는 β-H 추출→π 결합 형성→이탈기 배출을 한 단계에서 연결한다.", "en": "The three E2 arrows link β-H removal → π bond formation → leaving-group loss in one step."}, "mistakes": [{"a": {"ko": "O → C로 그려 놓고 제거라 부름", "en": "Drawing O → C and calling it elimination"}, "why": {"ko": "탄소 공격은 SN2 경로이며 E2에서 염기는 β-H를 공격한다.", "en": "Attack at carbon is the SN2 pathway; in E2 the base attacks the β-H."}}, {"a": {"ko": "C–H 전자쌍 → C에만 남겨 안정 음이온을 만듦", "en": "Leaving the C–H electron pair on C to make a stable anion"}, "why": {"ko": "E2의 해당 전자쌍은 같은 단계에서 C=C의 π 결합을 만든다.", "en": "In E2 that electron pair forms the C=C π bond in the same step."}}, {"a": {"ko": "Br이 같은 쪽인 임의 고리 배좌에서 E2 진행", "en": "E2 from an arbitrary ring conformation with Br on the same side"}, "why": {"ko": "보통 반응성 배좌에 anti periplanar H/이탈기 정렬이 필요하다.", "en": "Usually requires anti-periplanar H/leaving-group alignment in the reactive conformation."}}]}, "name": {"ko": "할로알케인의 E2 제거", "en": "E2 dehydrohalogenation"}, "eq": "CH₃CH₂Br + CH₃O⁻ → CH₂=CH₂ + CH₃OH + Br⁻", "co on scheme, so no solution-phase rate-determining step is assigned."}, "sel": {"ko": "γ-H가 있어 6원자 고리 전이 배열을 만들 수 있는 카보닐 화합물에서 가능하다. 양전하와 홀전자는 산소를 포함하는 조각에 남는다.", "en": "Possible for carbonyl compounds with a γ-H that can form a six-membered cyclic transition arrangement. The positive charge and unpaired electron stay on the oxygen-containing fragment."}, "exam": {"ko": "γ-H, 6원자 전이 배열, Cα–Cβ 절단, 중성 알켄 손실을 함께 확인한다.", "en": "Check together: the γ-H, the six-membered transition arrangement, Cα–Cβ cleavage, and loss of a neutral alkene."}, "mistakes": [{"a": {"ko": "C–C 절단 전자쌍을 모두 C에 남긴다", "en": "Leaves both electrons of the broken C–C bond on C"}, "why": {"ko": "중성 알켄과 에놀 라디칼 양이온을 만드는 동시 결합 재편이 사라진다.", "en": "Misses the simultaneous bond reorganization that forms a neutral alkene and the enol radical cation."}}, {"a": {"ko": "γ-H 대신 β-H를 같은 6원자 배열로 옮긴다", "en": "Moving a β-H instead of the γ-H through the same six-membered arrangement"}, "why": {"ko": "이 재배열은 카보닐 O–C–Cα–Cβ–Cγ–H의 배열을 필요로 한다.", "en": "This rearrangement requires the carbonyl O–C–Cα–Cβ–Cγ–H arrangement."}}, {"a": {"ko": "이온 조각에서 +•를 모두 없앤다", "en": "Removing +• from both ionic fragments"}, "why": {"ko": "이온화된 출발물의 전체 +1 전하와 홀전자 수를 보존하지 못한다.", "en": "Fails to conserve the overall +1 charge and unpaired electron of the ionized starting material."}}]}, "name": {"ko": "맥래퍼티 재배열", "en": "McLafferty rearrangement"}, "eq": {"ko": "γ-H를 가진 카보닐 분자 라디칼 양이온 → 에놀 라디칼 양이온 + 알켄", "en": "radical cation of a carbonyl with γ-H → enol radical cation + alkene"}, "cond": {"ko": "MS의 고에너지 분자 이온", "en": "High-energy molecular ion in MS"}}, "9-1": {"id": "9-1", "atoms": [{"id": "C1", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": -79.2, "y": 5.5}, {"id": "C2", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": -24.0, "y": -18.0}, {"id": "C3", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 24.0, "y": 18.0}, {"id": "C4", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": 79.2, "y": -5.5}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x ases with suitable electron-withdrawing groups, endo approach is favored; the simplest ethylene model has no endo/exo distinction."}, "exam": {"ko": "새 σ 결합 두 개와 다이엔 중앙의 새 π 결합 한 개를 동시에 표시한다.", "en": "Show the two new σ bonds and the new central π bond of the diene at the same time."}, "mistakes": [{"a": {"ko": "C에 +, C에 −를 만들고 차례로 고리를 닫는다", "en": "Makes + on one C and − on another, then closes the ring step by step"}, "why": {"ko": "열적 Diels–Alder 모형은 이온성 두 단계가 아닌 한 협동적 단계다.", "en": "The thermal Diels–Alder model is one concerted step, not two ionic steps."}}, {"a": {"ko": "친다이엔 C=C의 π 결합을 생성물에도 남긴다", "en": "Keeping the dienophile C=C π bond in the product"}, "why": {"ko": "새 σ 결합 두 개를 만들면서 친다이엔 π 결합 하나가 소모된다.", "en": "Forming two new σ bonds uses up one π bond of the dienophile."}}, {"a": {"ko": "s-trans로 고정된 다이엔의 양 끝을 그대로 연결한다", "en": "Joins the ends of a diene locked s-trans"}, "why": {"ko": "고리 전이 배열에 필요한 양 끝 p 오비탈의 접근이 불가능하다.", "en": "The two terminal p orbitals can't approach for the cyclic transition arrangement."}}]}, "name": {"ko": "딜스–알더 고리첨가", "en": "Diels–Alder cycloaddition"}, "eq": {"ko": "공액 다이엔 + 알켄/알카인 → 6원 고리; 분자 내·자기 이량화 포함", "en": "conjugated diene + alkene/alkyne → six-membered ring; includes intramolecular and self-dimerization"}, "cond": {"ko": "열; s-cis 다이엔; 전자 끄는 치환기 친다이엔이 유리", "en": "Heat; s-cis diene; dienophiles with electron-withdrawing groups favored"}}, "10-1": {"id": "10-1", "atoms": [{"id": "C1", "el": "C", "h": 0, "lp": 0, "charge": 0, "x": 44.9, "y": 0.0}, {"id": "C2", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 14.9, "y": -52.0}, {"id": "C3", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": -45.1, "y": -52.0}, {"id": "C4", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": -75.1, "y": -0.0}, {"id": "C5", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": -45.1, "y": 52.0}, {"id": "C6", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 14.9, "y": 52.0}, {"id": "H1", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 90.9, "y": -0.0}, {"id": "Br1", "e  지시기이며, 설폰화의 가역성을 이용하면 일시적인 자리 막기 전략이 가능하다.", "en": "Follow the directing effects of existing ring substituents. SO3H is a deactivating meta director, and the reversibility of sulfonation allows a temporary blocking strategy."}, "exam": {"ko": "친전자체의 황을 공격하고 방향족성을 회복하며, S+/O− 표현의 전체 전하와 가역 조건을 함께 확인한다.", "en": "The ring attacks the electrophile's sulfur and restores aromaticity; check the overall charge of the S+/O− representation and the reversible conditions together."}, "mistakes": [{"a": {"ko": "고리 π 전자쌍을 OH의 수소로만 보내 설폰화가 끝났다고 한다", "en": "Sending the ring π pair only to the OH hydrogen and calling the sulfonation done"}, "why": {"ko": "생성물에는 고리 탄소–황 결합이 필요하다.", "en": "The product needs a ring carbon–sulfur bond."}}, {"a": {"ko": "S+를 유지하면서 O−를 중성으로 바꾸고 결합차수는 그대로 둔다", "en": "Keeps S+, turns O− neutral, and leaves bond orders unchanged"}, "why": {"ko": "그 Lewis 표현에서 전체 생성물 전하가 +1이 되어 검산이 틀린다.", "en": "In that Lewis structure the overall product charge becomes +1, so the check fails."}}, {"a": {"ko": "뜨거운 묽은 산에서도 설폰화만 비가역적으로 진행한다고 표시한다", "en": "Showing sulfonation as irreversible even in hot dilute acid"}, "why": {"ko": "설폰화는 평형 반응이며 물·산·온도가 탈설폰화 방향을 좌우한다.", "en": "Sulfonation is an equilibrium; water, acid, and temperature control the desulfonation direction."}}]}, "name": {"ko": "방향족 설폰화·탈설폰화", "en": "Aromatic sulfonation and desulfonation"}, "eq": "ArH + SO3 ⇌ ArSO3H", "cond": {"ko": "SO3/H2SO4; 역방향은 뜨거운 묽은 산", "en": "SO3/H2SO4; reverse with hot dilute acid"}}, "11-1": {"id": "11-1", "atoms": [{"id": "O1", "el": "O", "h": 1, "lp": 2, "charge": 0, "x": 30.0, "y": 0.0}, {"id": "O2", "el": "O", "h": 2, "lp": 1, "charge": 1, "x": 184.0, "y": -0.0}, {"id": "H3", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 138.0, "y": 0.0}, {"id": "O1g1", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": -30.0, "y": -0.0, "grp": 1}], "bonds": [["H3", "O2", 1], ["O1", "O1g1", 1]], "steps": [{"arrows": [{"from": {"lp": "O1"}, "to": "H3"}, {"from": {"bond": ["O2", "H3"]}, "to": "O2"}], "move": {"O2": [210.0, -0.0], "H3": [76.0, 0.0]}, "order": null, "title": {"ko": "산소의 양성자화", "en": "Protonation of oxygen"}, "caption": {"ko": "메틸옥소늄 이온(CH3OH2+)과 물", "en": "Methyloxonium ion (CH3OH2+) and water"}, "extra": false, "goal": {"ko": "산소의 양성자화", "en": "Protonation of oxygen"}, "guide": {"ko": "① <b>O</b><small>(메탄올)</small>의 비공유 전자쌍 → <b>H</b><small>(H3O+에서 이동하는…)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(H3O+)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "이 산염기 평형에 관해 별도의 속도 결정 단계를 지정하지 않는다.", "en": "No separate rate-determining step is assigned for this acid–base equilibrium."}, "sel": {"ko": "양성자는 산소에 붙는다. 탄소–산소 결합과 탄소의 입체배치는 이 단계에서 바뀌지 않는다.", "en": "The proton attaches to oxygen. The carbon–oxygen bond and carbon's configuration don't change in this step."}, "exam": {"ko": "알코올 산소가 단일결합 3개와 비공유 전자쌍 1개를 가지면 형식전하는 +1이다.", "en": "An alcohol oxygen with three single bonds and one lone pair has a formal charge of +1."}, "mistakes": [{"a": {"ko": "H → O", "en": "H → O"}, "why": {"ko": "양성자에는 내줄 전자쌍이 없으므로 화살표는 O의 전자쌍에서 시작한다.", "en": "A proton has no electron pair to give, so the arrow starts at O's lone pair."}}, {"a": {"ko": "O–H의 σ 결합 → H", "en": "O–H σ bond → H"}, "why": {"ko": "결합 전자쌍이 산소에 남아야 물이 생긴다. 수소에 남기면 양성자 전달이 아니다.", "en": "The bonding pair must stay on oxygen to make water. Leaving it on hydrogen isn't a proton transfer."}}, {"a": {"ko": "O에서 시작한 화살표를 O에 끝낸다.", "en": "An arrow that starts at O and ends at O."}, "why": {"ko": "새 결합이 생길 원자는 이동하는 H이다.", "en": "The atom that forms the new bond is the transferred H."}}]}, "name": {"ko": "알코올·페놀의 양성자화", "en": "Protonation of alcohols and phenols"}, "eq": "ROH + H3O+ ⇌ ROH2+ + H2O", "cond": {"ko": "강산 수용액", "en": "Aqueous strong acid"}}, "11-2": {"id": "11-2", "atoms": [{"id": "O1", "el": "O", "h": 0, "lp": 2, "charge": 0, "x": 4.0, "y": -17.7}, {"id": "H2", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 43.9, "y": 5.3}, {"id": "O3", "el": "O", "h": 2, "lp": 2, "charge": 0, "x": 137.4, "y": 59.3}, {"id": "O1g1", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": -47.9, "y": 12.3, "grp": 1}], "bonds": [["H2", "O1", 1], ["O1", "O1g1", 1]], "steps": [{"arrows": [{"from": {"lp": "O3"}, "to": "H2"}, {"from": {"bond": ["O1", "H2"]}, "to": "O1"}], "move": {"O1": [-18.5, -30.7], "H2": [97.6, 36.3], "O1g1": [-70.4, -0.7]}, "order": null, "title": {"ko": "물에 의한 OH 양성자 수용", "en": "Water accepts the OH proton"}, "caption": {"ko": "메톡사이드 이온과 H3O+", "en": "Methoxide ion and H3O+"}, "extra": false, "goal": {"ko": "물에 의한 OH 양성자 수용", "en": "Water accepts the OH proton"}, "guide": {"ko": "① <b>O</b><small>(양성자를 받는 물)</small>의 비공유 전자쌍 → <b>H</b><small>(메탄올에서 빠지는 O…)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(메탄올)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "이 산 해리 평형에 관해 별도의 속도 결정 단계를 지정하지 않는다.", "en": "No separate rate-determining step is assigned for this acid-dissociation equilibrium."}, "sel": {"ko": "O–H 결합이 끊어지며 C–O 결합은 유지된다. 페놀의 공명식들은 별도 반응 단계가 아니다.", "en": "The O–H bond breaks while the C–O bond stays. Phenol resonance forms are not separate reaction steps."}, "exam": {"ko": "알콕사이드 O는 V−N−B = 6−6−1 = −1이고, 페놀은 공명 안정화로 더 잘 해리된다.", "en": "Alkoxide O: V − N − B = 6 − 6 − 1 = −1; phenol dissociates more because of resonance stabilization."}, "mistakes": [{"a": {"ko": "O–H의 σ 결합 → H", "en": "O–H σ bond → H"}, "why": {"ko": "산소에 전자쌍이 남아야 알콕사이드 음이온이 된다.", "en": "The electron pair must stay on oxygen to give the alkoxide anion."}}, {"a": {"ko": "물의 O → 메탄올의 메틸 탄소", "en": "Water O → methanol's methyl carbon"}, "why": {"ko": "이 반응은 산염기 반응이므로 새 결합은 H에 생긴다.", "en": "This is an acid–base reaction, so the new bond forms to H."}}, {"a": {"ko": "H만 떼고 받는 염기를 표시하지 않는다.", "en": "Removes H without showing the base that takes it."}, "why": {"ko": "수용액에서는 물이 양성자를 받아 H3O+가 생기므로 그 전자 이동도 필요하다.", "en": "In water, water takes the proton to form H3O+, so that electron flow is needed too."}}]}, "name": {"ko": "알코올·페놀의 산 해리", "en": "Acid dissociation of alcohols and phenols"}, "eq": {"ko": "ROH + H2O ⇌ RO− + H3O+; ArOH도 동일", "en": "ROH + H2O ⇌ RO− + H3O+; likewise for ArOH"}, "cond": {"ko": "묽은 수용액", "en": "Dilute aqueous solution"}}, "11-3": {"id": "11-3", "atoms": [{"id": "C1", "el": "C", "h": 2, "lp": 0, "charge": 0, "x": -30.0, "y": -0.0}, {"id": "O1", "el": "O", "h": 0, "lp": 2, "charge": 0, "x": 30.0, "y": 0.0}, {"id": "H2", "el": "H", "h": 0, "lp": 1, "charge": -1, "x": -138.0, "y": 0.0}, {"id": "O3", "el": "O", "h": 2, "lp": 1, "charge": 1, "x": 184.0, "y": -0.0}, {"id": "H4", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 138.0, "y": 0.0}], "bonds": [["C1", "O1", 2], ["H4", "O3", 1]], "steps": [{"arrows": [{"from": {"lp": "H2"}, "to": "C1"}, {"from": {"bond": ["C1", "O1"]}, "to": "O1"}], "move": {"H2": [-76.0, 0.0]}, "order": null, "title": {"ko": "카보닐 탄소에 하이드라이드 첨가", "en": "Hydride adds to the carbonyl carbon"}, "caption": {"ko": "사면체 알콕사이드(메톡사이드)", "en": "Tetrahedral alkoxide (methoxide)"}, "extra": false, "goal": {"ko": "카보닐 탄소에 하이드라이드 첨가", "en": "Hydride adds to the carbonyl carbon"}, "guide": {"ko": "① <b>H</b><small>(하이드라이드로 전달되는)</small>의 비공유 전자쌍 → <b>C</b><small>(포름알데하이드)</small> · ② <b>C=O π 결합</b> → <b>O</b><small>(카보닐)</small>", "en": "① the lone pair on <b>H</b> → <b>C</b> · ② the <b>C=O</b> π bond → <b>O</b>"}}, {"arrows": [{"from": {"lp": "O1"}, "to": "H4"}, {"from": {"bond": ["O3", "H4"]}, "to": "O3"}], "move": {"O3": [210.0, -0.0], "H4": [76.0, 0.0]}, "order": null, "title": {"ko": "후처리에서 알콕사이드의 양성자화", "en": "Protonation of the alkoxide in the workup"}, "caption": {"ko": "메탄올과 물", "en": "Methanol and water"}, "extra": true, "goal": {"ko": "후처리에서 알콕사이드의 양성자화", "en": "Protonation of the alkoxide in the workup"}, "guide": {"ko": "① <b>O</b><small>(카보닐)</small>의 비공유 전자쌍 → <b>H</b><small>(산 처리 때 O로 이…)</small> · ② <b>O–H 결합</b> → <b>O</b><small>(산 처리에 쓰는 H3…)</small>", "en": "① the lone pair on <b>O</b> → <b>H</b> · ② the <b>O–H</b> bond → <b>O</b>"}}], "card": {"rds": {"ko": "속도 결정 단계를 지정하지 않는다. 친핵성 첨가를 핵심 반응 단계로 배우되 모든 기질·시약에서 같은 단계가 가장 느리다고 단정하지 않는다.", "en": "No rate-determining step is assigned. Learn nucleophilic addition as the key step, but don't assume the same step is slowest for every substrate and reagent."}, "sel": {"ko": "알데하이드는 1차, 케톤은 2차 알코올을 준다. 포름알데하이드 예시에는 입체중심이 없다. 비키랄 조건에서 평면 카보닐로부터 새 입체중심이 생기면 보통 양쪽 면의 첨가가 가능하다.", "en": "Aldehydes give 1° and ketones give 2° alcohols. The formaldehyde example has no stereocenter. When a new stereocenter forms from a planar carbonyl under achiral conditions, addition to both faces is usually possible."}, "exam": {"ko": "하이드라이드 첨가에서는 C–H 결합을 만들고, 후처리의 양성자화에서는 O–H 결합을 만든다.", "en": "Hydride addition forms a C–H bond; protonation in the workup forms an O–H bond."}, "mistakes": [{"a": {"ko": "C → H", "en": "C → H"}, "why": {"ko": "전자를 내는 친핵체는 H이며 전자 부족한 C에서 시작하지 않는다.", "en": "The electron-donating nucleophile is H; don't start from the electron-poor C."}}, {"a": {"ko": "H → O", "en": "H → O"}, "why": {"ko": "카보닐의 친전자성 원자는 탄소이므로 C–H 결합이 만들어져야 한다.", "en": "The electrophilic atom of a carbonyl is carbon, so a C–H bond must form."}}, {"a": {"ko": "H → C만 그리고 C=O을 이중결합으로 둔다.", "en": "Draws only H → C and leaves C=O as a double bond."}, "why": {"ko": "C의 옥텟을 넘기므로 첨가와 함께 C=O π 전자가 O로 이동해야 한다.", "en": "That exceeds carbon's octet, so the C=O π electrons must move to O as the nucleophile adds."}}]}, "name": {"ko": "알데하이드·케톤의 하이드라이드 환원", "en": "Hydride reduction of aldehydes and ketones"}, "eq": "RCHO → RCH2OH; R2CO → R2CHOH", "cond": {"ko": "1. NaBH4/에탄올 또는 LiAlH4/에터 2. H3O+", "en": "1. NaBH4/ethanol or LiAlH4/ether 2. H3O+"}}, "12-1": {"id": "12-1", "atoms": [{"id": "O1", "el": "O", "h": 0, "lp": 2, "charge": 0, "x": 4.0, "y": -17.7}, {"id": "C2", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": 4.0, "y": -125.7}, {"id": "O3", "el": "O", "h": 1, "lp": 2, "charge": 0, "x": 4.0, "y": -185.7}, {"id": "H4", "el": "H", "h": 0, "lp" acked. Aryl alkyl ethers cleave on the alkyl side. Distinguish the SN1/E1 pathways of 3°, benzylic, and allylic substrates."}, "exam": {"ko": "에터 산성 절단의 첫 단계는 O의 양성자화이고, SN2 절단은 덜 혼잡한 탄소에서 일어난다.", "en": "The first step of acidic ether cleavage is O-protonation, and SN2 cleavage occurs at the less crowded carbon."}, "mistakes": [{"a": {"ko": "중성 에터에 I가 곧바로 공격하고 CH3O−를 이탈시킨다.", "en": "I attacks the neutral ether directly and expels CH3O−."}, "why": {"ko": "산소를 먼저 양성자화하여 중성 알코올이라는 더 좋은 이탈기를 만든다.", "en": "Protonating the oxygen first creates a better leaving group: a neutral alcohol."}}, {"a": {"ko": "I의 비공유 전자쌍 → O", "en": "I lone pair → O"}, "why": {"ko": "할로알케인을 만들려면 새 C–I 결합을 형성해야 한다.", "en": "Making the haloalkane requires forming a new C–I bond."}}, {"a": {"ko": "C–O 결합 전자쌍 → C", "en": "C–O bonding pair → C"}, "why": {"ko": "이탈하는 알코올의 산소에 전자쌍이 남아야 O의 +1 전하가 사라진다.", "en": "The pair must stay on the departing alcohol's oxygen for O's +1 charge to disappear."}}]}, "name": {"ko": "에터의 산성 SN2 절단", "en": "Acidic SN2 cleavage of ethers"}, "eq": "ROR′ + HX → ROH + R′X", "cond": {"ko": "HI 또는 HBr, 가열; 메틸/1차·단순 2차 에터", "en": "HI or HBr, heat; methyl/1° and simple 2° ethers"}}, "13-1": {"id": "13-1", "atoms": [{"id": "C1", "el": "C", "h": 1, "lp": 0, "charge": 0, "x": 0.0, "y": -20.0}, {"id": "O1", "el": "O", "h": 0, "lp": 2, "charge": 0, "x": 52.0, "y": 10.0}, {"id": "O2", "el": "O", "h": 1, "lp": 3, "charge": -1, "x": -0.0, "y": -128.0}, {"id": "O3", "el": "O", "h": 1, "lp": 2, "charge": 0, "x": 185.3, "y": 87.0}, {"id": "H3", "el": "H", "h": 0, "lp": 0, "charge": 0, "x": 145.5, "y": 64.0}, {"id": "C2", "el": "C", "h": 3, "lp": 0, "charge": 0, "x": -52.0, "y": 10.0}], "bonds": [["C1", "O1", 2], ["C1", "C2", 1], ["H3", "O3", 1]], "steps": [{"arrows": [{"from": {"lp": "O2"}, "to": "C1"}, {"from": {"bond": ["C1", "O1"]}, "to": "O1"}], "move": {"O2": [-0.0, -80.0]}, "order": null, "title": {"ko": "OH−의 카보닐 첨가", "en": "OH− adds to the carbonyl"}, "caption": {"ko": "사면체 알콕사이드", let rxn,atomsById,stepIndex,pos,bonds,lpCount,unpCount,charge;
let done=[],chosen=[],drawnCount=0;   // 현재 단계: 그린 화살표 표시, 실제로 맞힌 규칙(alts 포함)
let pendingLp={},pendingUnp={};       // 출발한 전자쌍·홀전자(단계 효과 적용 전까지 숨김)

const curStep=()=>rxn.steps[stepIndex];
const isHalfStep=st=>!!st&&st.arrows.some(a=>a.half);
const hasHalf=R=>R.steps.some(isHalfStep);
const SUBS={2:'₂',3:'₃',4:'₄'};
// 골격 꼭짓점: 결합 2개 이상인 탄소는 글자 없이 꼭짓점으로 (전자쌍·홀전자가 있으면 C로 표시)
function isVertex(a){
  if(a.el!=='C'||a.grp||lpCount[a.id]||unpCount[a.id])return false;
  const hn=neighbors(a.id).filter(n=>atomsById[n].el!=='H');
  if(hn.length<2)return false;
  if(bonds.some(b=>(b.a===a.id||b.b===a.id)&&b.order===3))return false;              // sp 탄소: 직선이라 꼭짓점이 안 보임
  if(bonds.filter(b=>(b.a===a.id||b.b===a.id)&&b.order===2).length>=2)return false;  // O=C=O·알렌
  if(hn.length===2&&angDist(dirAngle(a.id,hn[0]),dirAngle(a.id,hn[1]))>160)return false;
  return true;
}
// 표시용 라벨: 원소 + 숨은 H. H 글자는 결합이 없는 쪽에 두고, 원소 글자가 원자 위치에 오도록 정렬
function labelInfo(a){
  if(isVertex(a))return{text:'',anchor:'middle',dx:0,n:0,fs:22,side:null};
  const el=a.el,elw=[...el].length,h=a.h||0;
  if(!h)return{text:el,anchor:'middle',dx:0,n:elw,fs:el==='H'?17:22,side:null};
  const hs='H'+(SUBS[h]||'');
  const cs=neighbors(a.id).map(o=>Math.cos(dirAngle(a.id,o)*Math.PI/180));
  let left;
  if(!cs.length)left=el==='O';
  else if(cs.every(c=>c>0.25))left=true;
  else if(cs.every(c=>c<-0.25))left=false;
  else left=cs.reduce((t,c)=>t+c,0)>0.3;
  const text=left?hs+el:el+hs,fs=[...text].length>2?17:22,half=fs*(elw>1?0.62:0.36);
  return left?{text,anchor:'end',dx:half,n:elw,fs,side:180}:{text,anchor:'start',dx:-half,n:elw,fs,side:0};
}
const wide=id=>labelInfo(atomsById[id]).n>1;
const sameBond=(a,b,c,d)=>(a===c&&b===d)||(a===d&&b===c);
const bkey=(a,b)=>a<b?a+'|'+b:b+'|'+a;

/* ---------- 기하 ---------- */
const norm=a=>((a%360)+360)%360;
const angDist=(a,b)=>{const d=Math.abs(norm(a)-norm(b));return Math.min(d,360-d);};
function dirAngle(from,to){const[x1,y1]=pos[from],[x2,y2]=pos[to];return norm(Math.atan2(y2-y1,x2-x1)*180/Math.PI);}
function findBond(a,b){return bonds.find(x=>sameBond(x.a,x.b,a,b));}
function neighbors(id){return bonds.filter(b=>b.a===id||b.b===id).map(b=>b.a===id?b.b:b.a);}

// 결합 사이 빈 공간에 전자쌍을 고르게 배치
function spread(blockers,n){
  if(!n)return[];
  if(!blockers.length){return n===4?[0,90,180,270]:Array.from({length:n},(_,i)=>norm(i*360/n));}
  const s=[...blockers].sort((a,b)=>a-b);
  const gaps=s.map((a,i)=>({start:a,size:(i+1<s.length?s[i+1]:s[0]+360)-a,m:0}));
  for(let k=0;k<n;k++){let best=gaps[0];for(const g of gaps)if(g.size/(g.m+1)>best.size/(best.m+1))best=g;best.m++;}
  const out=[];
  gaps.forEach(g=>{for(let j=0;j<g.m;j++)out.push(norm(g.start+g.size*(j+1)/(g.m+1)));});
  return out;
}
// 전하 기호: 오른쪽 위 선호, 결합·전자와 겹치지 않는 자리
const CHARGE_PREF=[315,45,225,135,270,0,180,90];
function placeCharge(bondAngs,lpAngs){
  const ok=c=>bondAngs.every(b=>angDist(c,b)>=40)&&lpAngs.every(l=>angDist(c,l)>=35);
  const hit=CHARGE_PREF.find(ok);
  if(hit!==undefined)return hit;
  let best=315,score=-1;
  for(let k=0;k<72;k++){
    const c=norm(315+(k%2?1:-1)*Math.ceil(k/2)*5);
    const sc=Math.min(999,...bondAngs.map(b=>angDist(c,b)),...lpAngs.map(l=>angDist(c,l)+5));
    if(sc>score){score=sc;best=c;}
  }
  return best;
}
function computeLayout(){
  layout={};
  rxn.atoms.forEach(a=>{
    const nb=neighbors(a.id).map(o=>dirAngle(a.id,o));
    if(!isVertex(a)){const side=labelInfo(a).side;if(side!==null)nb.push(side);}  // H 글자 쪽은 비워 둠
    const n=lpCount[a.id]||0,u=unpCount[a.id]||0,slots=spread(nb,n+u);
    // 홀전자는 가장 트인 자리(이웃 결합에서 가장 먼 곳)에
    let ups=[],lps=slots;
    if(u){
      const open=ang=>nb.length?Math.min(...nb.map(b=>angDist(ang,b))):180;
      const order=slots.map((ang,i)=>[open(ang),i]).sort((p,q)=>q[0]-p[0]).slice(0,u).map(p=>p[1]);
      ups=order.map(i=>slots[i]);lps=slots.filter((_,i)=>!order.includes(i));
    }
    layout[a.id]={lps,ups,ch:charge[a.id]?placeCharge(nb,slots):null};
  });
}
function lpXY(id,ang){const[x,y]=pos[id],r=wide(id)?30:27,t=ang*Math.PI/180;return[x+r*Math.cos(t),y+r*Math.sin(t)];}
function chargeXY(id,ang){const[x,y]=pos[id],a=atomsById[id],r=isVertex(a)?14:wide(id)?23:19,t=ang*Math.PI/180;return[x+r*Math.cos(t),y+r*Math.sin(t)];}

// 원소 기호 글자 상자 가장자리에서 결합선을 끊음 (골격 꼭짓점은 끊지 않음)
function trimAt(id,ux,uy){
  const a=atomsById[id];
  if(isVertex(a))return 0;
  const{fs,n}=labelInfo(a);
  const w=fs*0.3*n+3,h=fs*0.42+2;
  return Math.min(Math.abs(ux)>1e-6?w/Math.abs(ux):1e9,Math.abs(uy)>1e-6?h/Math.abs(uy):1e9)+2;
}
// 두 원자 사이 선분(라벨 가장자리에서 끊음). 결합이 아직 없어도(새로 생길 결합) 계산 가능
function pairSeg(A,B){
  const[x1,y1]=pos[A],[x2,y2]=pos[B];
  const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
  const t1=trimAt(A,ux,uy),t2=trimAt(B,ux,uy);
  return{sx:x1+ux*t1,sy:y1+uy*t1,ex:x2-ux*t2,ey:y2-uy*t2,ux,uy};
}
const bondSeg=b=>pairSeg(b.a,b.b);
function segMid(b){const s=bondSeg(b);return[(s.sx+s.ex)/2,(s.sy+s.ey)/2];}
function pairMid(A,B){const s=pairSeg(A,B);return[(s.sx+s.ex)/2,(s.sy+s.ey)/2];}
// 결합 위의 점: fromId 끝에서 t 비율만큼
function bondPoint(b,fromId,t){
  const s=bondSeg(b);
  return b.a===fromId?[s.sx+(s.ex-s.sx)*t,s.sy+(s.ey-s.sy)*t]:[s.ex+(s.sx-s.ex)*t,s.ey+(s.sy-s.ey)*t];
}

// 화면에 반응 전체(이동 후 위치 포함)가 들어오도록 viewBox 맞춤
function fitView(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};
  rxn.atoms.forEach(a=>add(a.x,a.y));
  rxn.steps.forEach(s=>Object.values(s.move||{}).forEach(([x,y])=>add(x,y)));
  const pad=44,w=Math.max(x1-x0+2*pad,360),h=Math.max(y1-y0+2*pad,300),cx=(x0+x1)/2,cy=(y0+y1)/2;
  svg.setAttribute('viewBox',`${cx-w/2} ${cy-h/2} ${w} ${h}`);
}

/* ---------- 렌더 ---------- */
function lpHidden(id,i){
  if(pendingLp[id]&&pendingLp[id].includes(i))return true;
  return !!(drag&&drag.src.type==='lp'&&drag.src.atom===id&&drag.src.idx===i);
}
function unpHidden(id,i){
  if(pendingUnp[id]&&pendingUnp[id].includes(i))return true;
  return !!(drag&&drag.src.type==='unp'&&drag.src.atom===id&&drag.src.idx===i);
}
function fmtCharge(c){const m=Math.abs(c);return(m>1?m:'')+(c>0?'+':'−');}
const showHints=()=>mode==='learn'||hintOn;

function render(){
  computeLayout();
  molG.innerHTML='';
  bonds.forEach(b=>{
    const s=bondSeg(b),px=-s.uy,py=s.ux;
    const g=ns('g');g.dataset.bond=bkey(b.a,b.b);

    g.appendChild(glow);

      l.setAttribute('x2',s.ex+px*o);l.setAttribute('y2',s.ey+py*o);
      l.setAttribute('class','bond');
      g.appendChild(l);
    }
    molG.appendChild(g);
  });
  rxn.atoms.forEach(a=>{
    const[x,y]=pos[a.id],g=ns('g');g.dataset.atom=a.id;
    const glow=ns('circle');
    glow.setAttribute('cx',x);glow.setAttribute('cy',y);glow.setAttribute('r',isVertex(a)?16:24);
    glow.setAttribute('class','drop-glow'+(drag&&drag.hover===a.id?' on':''));
    g.appendChild(glow);
    if(!isVertex(a)){
      const t=ns('text'),li=labelInfo(a);
      t.setAttribute('x',x+li.dx);t.setAttribute('y',y);
      t.setAttribute('class','atom-label'+(li.fs===17?' small':''));
      if(li.anchor!=='middle')t.style.textAnchor=li.anchor;
      t.textContent=li.text;
      g.appendChild(t);
    }
    const L=layout[a.id];
    if(L.ch!==null){
      const[cx,cy]=chargeXY(a.id,L.ch),c=ns('text');

    }
